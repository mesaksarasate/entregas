function abrirCatalogo(){ CAT.q=""; CAT.cat=""; CAT.edit=null; $("#catSheet").hidden=false; document.body.style.overflow="hidden"; renderCatalogo(); }
function fecharCatalogo(){ $("#catSheet").hidden=true; document.body.style.overflow=""; if(ui.tab==="config") renderConfig(true); }
function catForm(p){
  const cats=[...new Set(catalogo().map(x=>x.cat).filter(Boolean))];
  return `<form class="card" id="catForm" autocomplete="off"><h2>${p.id?"Editar produto":"Novo produto"}</h2>
    <label>Nome <input type="text" id="kNome" value="${esc(p.nome||"")}" required></label>
    <div class="row"><label>Preço (R$) <input type="text" inputmode="decimal" id="kPreco" value="${p.preco!=null?n2(p.preco):""}" placeholder="0,00"></label>
    <label>Categoria <input type="text" id="kCat" list="kCats" value="${esc(p.cat||"")}" placeholder="Lanches"></label></div>
    <datalist id="kCats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <label>Descrição <input type="text" id="kDesc" value="${esc(p.desc||"")}" placeholder="Opcional"></label>
    <div class="btns"><button type="submit" class="btn primary">Salvar</button><button type="button" class="btn" data-act="catcancel">Cancelar</button>
    ${p.id?`<button type="button" class="btn ${CAT.arm===p.id?"danger":""}" data-act="catdel" data-id="${p.id}">${CAT.arm===p.id?"Toque para confirmar":svg("trash")+" Excluir"}</button>`:""}</div></form>`;
}
function renderCatalogo(){
  const b=$("#catBody"); if(!b||$("#catSheet").hidden) return;
  if(b.contains(document.activeElement)&&document.activeElement.tagName==="INPUT"&&document.activeElement.id!=="kBusca") return;
  const l=catalogo(), cats=[...new Set(l.map(x=>x.cat||"Outros"))];
  const q=CAT.q.trim().toLowerCase(), vis=l.filter(x=>(!CAT.cat||(x.cat||"Outros")===CAT.cat)&&(!q||(x.nome+" "+(x.desc||"")).toLowerCase().includes(q)));
  let h="";
  if(CAT.edit) h+=catForm(CAT.edit==="novo"?{}:(l.find(x=>x.id===CAT.edit)||{}));
  if(l.length){
    h+=`<label class="sr-only" for="kBusca">Buscar produto</label><input type="text" inputmode="search" enterkeyhint="search" id="kBusca" placeholder="Buscar produto" value="${esc(CAT.q)}">`;
    if(cats.length>1) h+=`<div class="chips" role="group" aria-label="Categorias"><button data-act="catf" data-c="" aria-pressed="${!CAT.cat}">Todos · ${l.length}</button>${cats.map(c=>`<button data-act="catf" data-c="${esc(c)}" aria-pressed="${CAT.cat===c}">${esc(c)} · ${l.filter(x=>(x.cat||"Outros")===c).length}</button>`).join("")}</div>`;
    const grupos=[...new Set(vis.map(x=>x.cat||"Outros"))];
    h+=grupos.map(g=>`<div class="sectionhead small"><span class="muted"><b>${esc(g)}</b></span></div><div class="card" style="padding-block:2px">${vis.filter(x=>(x.cat||"Outros")===g).map(x=>{ const [bg,fg]=corTipo(S.cfg.lanchonete.tipo);
      return `<div class="cat-it ${x.on===false?"off":""}"><span class="tic" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:${bg};color:${fg}">${svg(S.cfg.lanchonete.tipo||"tag")}</span>
        <button class="linkbtn" data-act="catedit" data-id="${x.id}" style="flex:1;min-width:0;text-align:left;color:inherit;text-decoration:none"><div class="nm">${esc(x.nome)}</div>${x.desc?`<div class="ds">${esc(x.desc)}</div>`:""}</button>
        <span class="pr">${BRL(x.preco||0)}</span><button class="sw" role="switch" aria-checked="${x.on!==false}" aria-label="${esc(x.nome)} disponível" data-act="catsw" data-id="${x.id}"></button></div>`; }).join("")}</div>`).join("")||`<div class="card flat empty">${svg("search")}<span>Nada encontrado.</span></div>`;
  } else if(!CAT.edit) h+=`<div class="calm">${svg("tag")}<b>Nenhum produto ainda</b></div>`;
  if(!CAT.edit) h+=`<button class="btn primary xl" data-act="catnovo">${svg("plus")} Produto</button>`;
  b.innerHTML=h;
  const f=$("#catForm"); if(f){ f.onsubmit=e=>{ e.preventDefault(); const nome=$("#kNome").value.trim(); if(!nome) return $("#kNome").focus();
      const preco=Math.round(parseNum($("#kPreco").value)*100)/100||0, it={nome,preco,cat:$("#kCat").value.trim(),desc:$("#kDesc").value.trim()};
      const L=clone(catalogo()); if(CAT.edit==="novo") L.push({id:newId(),on:true,...it}); else { const i=L.findIndex(x=>x.id===CAT.edit); if(i>=0) L[i]={...L[i],...it}; }
      CAT.edit=null; CAT.arm=null; salvarCatalogo(L); toast("Produto salvo"); };
    if(CAT.edit==="novo") setTimeout(()=>$("#kNome")&&$("#kNome").focus(),50); }
  const kb=$("#kBusca"); if(kb) kb.oninput=()=>{ CAT.q=kb.value; renderCatalogo(); const k=$("#kBusca"); k.focus(); k.setSelectionRange(k.value.length,k.value.length); };
}
function acaoCatalogo(a,t){
  if(a==="catnovo"){ CAT.edit="novo"; CAT.arm=null; renderCatalogo(); $("#catSheet").scrollTop=0; }
  else if(a==="catedit"){ CAT.edit=t.dataset.id; CAT.arm=null; renderCatalogo(); $("#catSheet").scrollTop=0; }
  else if(a==="catcancel"){ CAT.edit=null; CAT.arm=null; renderCatalogo(); }
  else if(a==="catf"){ CAT.cat=t.dataset.c; renderCatalogo(); }
  else if(a==="catsw"){ const L=clone(catalogo()), x=L.find(y=>y.id===t.dataset.id); if(x){ x.on=x.on===false; salvarCatalogo(L); } }
  else if(a==="catdel"){ const id=t.dataset.id; if(CAT.arm!==id){ CAT.arm=id; renderCatalogo(); return; } CAT.arm=null; CAT.edit=null; salvarCatalogo(catalogo().filter(x=>x.id!==id)); toast("Produto excluído"); }
  else if(a==="catclose") fecharCatalogo();
  else return false;
  return true;
}

function renderItensPed(){

function pedItens(){ const l=catalogo(); return Object.keys(PIT.q).filter(k=>PIT.q[k]>0).map(k=>{ const x=l.find(y=>y.id===k); return x?{n:x.nome,q:PIT.q[k],p:x.preco||0}:null; }).filter(Boolean); }
function pedTotal(){ return Math.round(pedItens().reduce((a,i)=>a+i.q*i.p,0)*100)/100; }

const I18N={en:{},es:{}}, I18NP={en:[],es:[]};
function trTxt(t,L){ const k=t.replace(/\s+/g," ").trim(); if(!k||!/[A-Za-zÀ-ú]/.test(k)) return t; let r=I18N[L][k];
  if(r==null) for(const [re,f] of I18NP[L]){ const m=k.match(re); if(m){ r=typeof f==="function"?f(...m):k.replace(re,f); break; } }
  if(r==null) return t; const pre=t.match(/^\s*/)[0], pos=t.match(/\s*$/)[0]; return pre+r+pos; }
function trNo(n,L){
  if(n.nodeType===3){ const p=n.parentNode; if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest("[data-noi18n],.lmap,pre,.ms"))) return; const v=trTxt(n.nodeValue,L); if(v!==n.nodeValue) n.nodeValue=v; return; }
  if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.nodeName)) return;
  for(const a of ["placeholder","aria-label","title"]){ const v=n.getAttribute(a); if(v){ const w=trTxt(v,L); if(w!==v) n.setAttribute(a,w); } }
  if(n.nodeName==="INPUT"&&(n.type==="submit"||n.type==="button")&&n.value){ const w=trTxt(n.value,L); if(w!==n.value) n.value=w; }
  n.childNodes.forEach(c=>trNo(c,L));
}

const novoToken=()=>{ const A="abcdefghijkmnopqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(16)); r.forEach(x=>s+=A[x%A.length]); return s; };
const linkRastreio=t=>`${location.origin}${location.pathname}?r=${t}`;
function enviarRastreio(nid,cid){
  const c=((S.noites[nid]||{}).corridas||[]).find(x=>x.id===cid); if(!c) return;
  const novo=!c.rastreio, t=c.rastreio||novoToken();

  const msg=`Olá${c.cliente?", "+c.cliente:""}! Sou o entregador da ${est} e estou a caminho com a sua entrega. Acompanhe por aqui: ${link}`;
  const w=c.tel?waUrl(c.tel,msg):"";

  if(novo){ const L=S.cfg.lanchonete;

}

const Rastreio={watch:null,ult:0,lock:null,
  ativos(){ if(!(S.mode==="db"&&S.role==="entregador")) return []; const d=S.noites[noiteId()]; return ((d&&d.corridas)||[]).filter(c=>c.status==="rota"&&c.rastreio).map(c=>c.rastreio); },

async function iniciarRastreioCliente(tok){
  document.body.innerHTML=`<div class="trk"><div class="brand"><div class="word"><b>Persuadir</b><span>Entregas</span></div></div>
    <div id="globalNote"></div><div class="card"><div class="eyebrow" id="tEst"></div><div class="st" id="tSt">Carregando…</div><div class="muted small" id="tAt"></div></div>
    <div class="lmap" id="tMap" hidden></div></div><div id="toast" class="toast" hidden></div>`;
  document.title="Acompanhe sua entrega";
  try{ await FB.init(); }catch(e){ $("#tSt").textContent="Sem conexão. Tente de novo em instantes."; return; }
  let mp=null;
  const desenhar=async d=>{
    if(!d){ $("#tSt").textContent="Link de rastreio inválido ou expirado."; $("#tMap").hidden=true; return; }
    $("#tEst").textContent=d.estab||"";
    $("#tSt").textContent=d.status==="rota"?"Sua entrega está a caminho":d.status==="entregue"?"Entrega concluída. Obrigado pela preferência!":"Entrega encerrada";

    if(d.status!=="rota"||!(ptOk(d)||ptOk(d.dest))){ $("#tMap").hidden=true; return; }
    try{ await carregarMapa(); }catch(e){ return; }
    $("#tMap").hidden=false;
    const primeiro=!mp; if(!mp){ mp=novoMapa($("#tMap")); setTimeout(()=>{ mp.resize(); mp.ajustar(); },60); }
    mp.pin("moto",ptOk(d)?d:null); mp.pin("b",d.dest); if(primeiro) mp.ajustar();
  };
  FB.onDoc("rastreio/"+tok,d=>desenhar(d),()=>{ $("#tSt").textContent="Link de rastreio inválido ou expirado."; });
}

async function fotoQuadrada(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,err)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=err; i.src=url;});
    const n=Math.min(img.naturalWidth,img.naturalHeight), S2=320, c=document.createElement("canvas"); c.width=c.height=S2;
    c.getContext("2d").drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,S2,S2);
    return await new Promise(ok=>c.toBlob(b=>ok({blob:b,data:c.toDataURL("image/jpeg",.85)}),"image/jpeg",.85));
  } finally { URL.revokeObjectURL(url); }
}

async function exportarCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const L=[["noite","hora","cliente","rua","numero","bairro","complemento","referencia","km","min","valor","faixa","situacao","concluida_as","somada","noite_paga"].join(";")];
  Object.keys(S.noites).sort().forEach(id=>(S.noites[id].corridas||[]).forEach(c=>{ const e=c.end||{};
    L.push([id,c.hora,c.cliente,e.rua,e.numero,e.bairro,e.complemento,e.referencia,n1(c.km),c.min||"",n2(c.valor),c.faixa,c.status,c.concluidaEm?hhmm(c.concluidaEm):"",c.conta===false?"nao":"sim",S.pag[id]?"sim":"nao"].map(q).join(";")); }));
  L.push(""); L.push(["noite","valor_pago","forma","obs"].join(";"));
  Object.keys(S.pag).sort().forEach(id=>{const p=S.pag[id]; L.push([id,n2(p.valor),p.forma,p.obs].map(q).join(";"));});
  if(isEnt()&&S.abast.length){ L.push(""); L.push("abastecimento;valor;litros"); [...S.abast].sort((a,b)=>(a.data||"").localeCompare(b.data||"")).forEach(a=>L.push([a.data,n2(a.valor),String(a.litros).replace(".",",")].map(q).join(";"))); }
  const csv="﻿"+L.join("\n");
  try{ const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})), a=document.createElement("a");
    a.href=url; a.download=`entregas-${noiteId()}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Planilha baixada"); }
  catch(err){ $("#csvFallback").innerHTML=`<pre class="summary">${esc(csv)}</pre>`; }
}

document.addEventListener("change",e=>{
  if(!e.target.classList||!e.target.classList.contains("lucin")) return;
  const nid=e.target.dataset.n, cid=e.target.dataset.id, raw=e.target.value.trim(), v=raw===""?null:parseNum(raw);
  if(raw!==""&&!(v>=0)){ toast("Valor inválido"); return; }
  const vals={...lucrosDe(nid)}; if(v==null) delete vals[cid]; else vals[cid]=Math.round(v*100)/100;
  if(ui.simProp) ui.sim.lucros[nid]=vals; else Store.saveLucro(nid,vals); if(v!=null) e.target.value=n2(v);
  setTimeout(()=>{ if(!(document.activeElement&&document.activeElement.classList.contains("lucin"))) renderCorridas(); },50);
});
