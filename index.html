<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="word"><b>Persuadir</b><span>Entregas</span></div></div>
    <span class="topacts"><button class="iconbtn" id="themeBtn" data-act="themetoggle" aria-label="Tema"></button><span id="sosHost"></span><span id="pswHost"></span><button class="iconbtn bellbtn" id="bellBtn" data-act="notifs" aria-label="Notificações"><span id="bellIc"></span><span class="bbadge" id="bellBadge" hidden></span></button></span>
  </header>
  <div id="globalNote"></div>
  <div id="simBar"></div>
  <div id="notifBox"></div>

  <section id="tab-inicio" class="wrap"></section>
  <section id="tab-corridas" class="wrap" hidden>
    <div class="page-head"><div><h1 id="nightTitle" class="num">—</h1><button class="linkbtn" id="toTonight" hidden>Ir para hoje</button></div><div class="pgacts"><button class="iconbtn" id="prevN" aria-label="Jornada anterior"></button><button class="iconbtn" id="nextN" aria-label="Próxima noite"></button></div></div>
    <div id="corridasBody" class="wrap"></div>
  </section>
  <section id="tab-receita" class="wrap" hidden>
    <div class="page-head"><h1 id="recTitle">Receita</h1><input type="month" id="hMes" aria-label="Mês" style="width:auto"></div>
    <div id="receitaBody" class="wrap"></div>
  </section>
  <section id="tab-comb" class="wrap" hidden>
    <div class="page-head"><div style="display:flex;align-items:center;gap:4px"><button class="iconbtn" data-act="tab" data-t="receita" aria-label="Voltar" id="combBack"></button><h1>Combustível</h1></div></div>
    <div id="combBody" class="wrap"></div>
  </section>
  <section id="tab-config" class="wrap" hidden>
    <h1>Ajustes</h1>
    <div id="configBody" class="wrap"></div>
  </section>
</div>

<!-- Nova corrida -->
<div class="sheet" id="sheet" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="iconbtn" id="sheetClose" aria-label="Fechar"></button>
      <h1 id="sheetTitle">Nova corrida</h1>
    </div>
    <form id="fCorrida" class="wrap" autocomplete="off">
      <div class="card">
        <h2>Cliente</h2>
        <div class="row">
          <label>Rua / Avenida <input type="text" id="cRua" placeholder="Rua Paraíba"></label>
          <label class="narrow">Número <input type="text" id="cNum" placeholder="123"></label>
        </div>
        <div class="row">
          <label>Bairro <input type="text" id="cBairro" placeholder="Centro"></label>
          <label class="narrow">CEP <input type="text" id="cCep" inputmode="numeric" placeholder="Opcional" autocomplete="postal-code"></label>
        </div>
        <label>Complemento <input type="text" id="cComp" placeholder="Casa, apto"></label>
        <label>Referência <input type="text" id="cRef" placeholder="Perto da praça"></label>
        <div class="row"><label>Nome ou pedido <input type="text" id="cCliente" placeholder="Opcional"></label>
        <label>Celular <input type="tel" id="cTel" placeholder="DDD + número"></label></div>
      </div>
      <div class="card">
        <div class="sectionhead"><h2>Rota</h2><span class="chip route" id="cVeic"></span></div>
        <div class="seg" id="cOrig"><button type="button" data-o="loja" aria-pressed="true"></button><button type="button" data-o="gps" aria-pressed="false"></button></div>
        <div class="lmap" id="cMap" hidden></div>
        <div class="geoinfo" id="cGeoInfo"></div>
        <button type="button" class="btn" id="cGeo"></button>
        <div class="btns"><a class="btn route" id="lnkMaps" href="https://www.google.com/maps" target="_blank" rel="noopener" style="flex:2 1 auto"></a><a class="btn" id="lnkWaze" href="https://waze.com/ul" target="_blank" rel="noopener">Waze</a></div>
        <div class="row">
          <label class="bigin">Km <input type="text" inputmode="decimal" id="cKm" placeholder="0,0"></label>
          <label class="bigin">Minutos <input type="text" inputmode="numeric" id="cMin" placeholder="0"></label>
        </div>
        <div id="cPreview"></div>
      </div>
      <div class="card">
        <h2>Print da rota</h2>
        <div class="thumbs" id="cPrints"></div>
        <label class="btn" style="color:var(--fg);flex-direction:row" id="cPrintLbl"><span id="cPrintIc"></span>Anexar print<input type="file" id="cPrintIn" accept="image/*" multiple hidden></label>
      </div>
      <div class="card" id="cEditBox" hidden>
        <h2>Situação</h2>
        <div class="row">
          <label>Situação
            <select id="cStatus"><option value="rota">Em rota</option><option value="entregue">Entregue</option><option value="cancelada">Cancelada</option><option value="ausente">Cliente ausente</option></select></label>
          <label class="check" style="align-self:end;padding-bottom:12px"><input type="checkbox" id="cConta" checked> Contar no total</label>
        </div>
      </div>
      <div class="btns">
        <button type="submit" class="btn" id="cSave">Saí para entrega</button>
        <a class="btn good" id="cConcluir" href="#" target="_blank" rel="noopener"></a>
      </div>
    </form>
  </div>
</div>


<!-- Catálogo (proprietário) -->
<div class="sheet" id="catSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="catclose" aria-label="Voltar" id="catClose"></button><h1>Catálogo</h1></div>
    <div id="catBody" class="wrap"></div>
  </div>
</div>
<!-- Nova corrida (proprietário) -->
<div class="sheet" id="pedSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="pedclose" aria-label="Fechar" id="pedClose"></button><h1>Nova corrida</h1></div>
    <form id="fPed" class="wrap" autocomplete="off">
      <div class="card">
        <label id="pEntBox">Entregador <select id="pEnt"></select></label>
        <div class="row">
          <label>Rua / Avenida <input type="text" id="pRua" placeholder="Rua Paraíba"></label>
          <label class="narrow">Número <input type="text" id="pNum" placeholder="123"></label>
        </div>
        <div class="row">
          <label>Bairro <input type="text" id="pBairro" placeholder="Centro"></label>
          <label class="narrow">CEP <input type="text" id="pCep" inputmode="numeric" placeholder="Opcional" autocomplete="postal-code"></label>
        </div>
        <label>Complemento <input type="text" id="pComp" placeholder="Casa, apto"></label>
        <label>Referência <input type="text" id="pRef" placeholder="Perto da praça"></label>
        <div class="row"><label>Nome ou pedido <input type="text" id="pCliente" placeholder="Opcional"></label>
        <label>Celular <input type="tel" id="pTel" placeholder="DDD + número"></label></div>
        <label>Observação <input type="text" id="pObs" placeholder="Troco para R$ 50"></label>
      </div>
      <div class="card" id="pItensBox" hidden></div>
      <div class="card"><div class="row"><label>Valor do pedido <input type="text" inputmode="decimal" id="pTotal" placeholder="0,00"></label>
        <label>Pagamento <select id="pForma">${""}</select></label></div></div>
      <div class="card">
        <div class="lmap" id="pMap" hidden></div>
        <div class="geoinfo" id="pGeoInfo"></div>
        <button type="button" class="btn" id="pGeo"></button>
      </div>
      <button type="submit" class="btn primary xl" id="pSend"></button>
    </form>
  </div>
</div>

<!-- Ponto no mapa -->
<div class="sheet" id="geoSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="geoclose" aria-label="Fechar" id="geoClose"></button><h1 id="geoTitle">Partida no mapa</h1></div>
    <div class="row" style="align-items:end"><label>Endereço <input type="text" id="gQ"></label><button type="button" class="btn" id="gBusca" style="flex:0 1 120px"></button></div>
    <div class="lmap tall" id="gMap"></div>
    <div class="btns"><button type="button" class="btn" id="gGps"></button><button type="button" class="btn primary" id="gOk">Salvar ponto</button></div>
  </div>
</div>

<!-- Tela inicial: criar usuário -->
<div id="probHost"></div><div id="jornHost"></div><div id="passarHost"></div>
<div class="onb" id="onb" hidden><div class="onb-card" id="onbCard"></div></div>

<!-- Cadastro -->
<div class="sheet" id="cadSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="cadclose" aria-label="Fechar" id="cadClose"></button><h1>Cadastro</h1></div>
    <form id="fCad" class="wrap" autocomplete="off" novalidate></form>
  </div>
</div>

<!-- Alternar perfil -->
<div class="sheet" id="pfSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="pfclose" aria-label="Fechar" id="pfClose"></button><h1>Perfis</h1></div>
    <div id="pfList" class="list"></div>
  </div>
</div>

<!-- Trocar contratante -->
<div class="sheet" id="ctrSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="ctrclose" aria-label="Fechar" id="ctrClose"></button><h1 id="ctrTitle">Negócios</h1></div>
    <div id="ctrList" class="list"></div>
  </div>
</div>

<div class="sheet" id="notifSheet" hidden>
  <div class="wrap">
    <div class="bar"><button class="iconbtn" data-act="notifclose" aria-label="Fechar" id="notifClose"></button><h1>Notificações</h1><button class="linkbtn small" data-act="notiflimpar" id="notifLimpar">Limpar</button></div>
    <div id="notifList" class="list"></div>
  </div>
</div>

nes with their password.","Recorded deliveries keep their original amount."])],["Link",o(e?["Ask the owner for the <b>invite code</b>, type it on Home and tap <b>Link</b>.","You can work for several businesses and switch on Home."]:["Send the <b>invite code</b> (Settings) to riders. Each link request needs your approval.","With several riders, switch between them by their initials on Home."])],["Language, time zone and theme",o(["Settings › Language and region: Portuguese, English or Spanish, and the time zone (automatic from the device).","<b>Auto</b> theme: dark at night (6 pm to 6 am), light during the day."])],["Privacy and security",o(["Deleted items go to <b>Recently deleted</b>. Nothing disappears on its own.","<b>Delete my profile and data</b> erases what's yours forever, with your password.","Permissions are enforced by the server: nobody changes what belongs to the other."])]]},es:{tit:"Manual de la app",abrir:"Abrir",itens:[["Inicio",o(e?["La frase de arriba dice lo que pasa ahora.","Cuando llega un <b>Nuevo envío</b>, la tarjeta late, suena y muestra ruta, km y valor.","Toca <b>Salir a entregar</b>. Si no puedes llevarlo, toca <b>No puedo</b>: el dueño recibe el aviso.","En ruta: <b>Navegar</b>, <b>Waze</b>, <b>Cliente</b> (envía el enlace de seguimiento) y <b>Entregué</b>.","En <b>Hoy</b> está la línea del día con cada paso."]:["La frase de arriba resume el momento: quién está en ruta, qué espera repartidor, solicitudes.","El botón <b>Nuevo envío</b> siempre está a mano.","Cuando alguien está en ruta, aparece el mapa <b>En vivo</b>.","Recibes aviso con sonido en cada paso: salió, km ajustado, entregado, no entregado o no puede llevarlo.","En <b>Hoy</b> está la línea del día con cada paso."])],["Nuevo envío",o(e?["Los envíos los crea el dueño. Si aún no lo hizo, toca <b>Solicitar envío</b>: vale después de la aprobación.","Si el camino real fue otro, usa <b>Editar trayecto</b>. Queda marcado como <b>Km ajustado</b> y el dueño recibe el aviso."]:["Completa la dirección y toca <b>Ubicar dirección en el mapa</b>. Ruta, km y valor se calculan al instante, y el repartidor ve el mismo mapa.","Elige ítems del <b>Catálogo</b>: el valor del pedido se completa solo. Indica la forma de pago.","Si el repartidor no puede llevarlo, toca <b>Reenviar</b> o <b>Cancelar</b>."])],...e?[]:[["Catálogo",o(["Está en Ajustes. Registra nombre, precio, categoría y descripción.","El interruptor marca el producto como disponible o agotado.","En Nuevo envío, toca + y − para armar el pedido."])],["Extracto",o(["Ventas menos pagos al repartidor y comisiones del terminal. El costo de los productos no entra.","Mira Hoy, Semana o Mes, y por forma de pago.","Las comisiones de débito y crédito están al final del Extracto.","En <b>Pago pendiente</b>, toca la jornada para registrar el pago con valor, forma y comprobante."])]],...e?[["Ganancias y meta",o(["El gráfico muestra la diaria de cada jornada y la meta (punteada).","La meta es cuánto quieres que te quede limpio, más el combustible estimado.","Cuando el dueño registra el pago, los envíos de la jornada quedan bloqueados."])],["Combustible",o(["Actualiza el precio por litro cuando cambie.","Al cargar, escribe solo el valor pagado: los litros se calculan.","Bicicleta y a pie no usan combustible."])]]:[],["Mapa y valor",o(["El mapa es real (OpenStreetMap), con ruta por las calles. Gira y acerca con dos dedos.","La distancia es siempre del negocio al cliente. Cada rango de km tiene valor fijo y ningún envío vale menos que la tarifa mínima.","El km se redondea hacia abajo, con un decimal."])],["Seguimiento para el cliente",o(["El cliente recibe un enlace y sigue al repartidor mientras su app esté abierta.","Al entregar, el enlace lo muestra y la ubicación deja de compartirse."])],["Jornada",o(["La jornada va de un cambio al siguiente (por defecto 04:00). El dueño lo ajusta en Ajustes › Negocio."])],["Tabla de tarifas",o(["El repartidor envía la tabla acordada y el dueño la acepta.","Después solo cambia con los dos: uno propone y el otro acepta o rechaza con su contraseña.","Los envíos registrados mantienen su valor."])],["Vínculo",o(e?["Pide al dueño el <b>código de invitación</b>, escríbelo en Inicio y toca <b>Vincular</b>.","Puedes trabajar para varios negocios y cambiar en Inicio."]:["Envía el <b>código de invitación</b> (Ajustes) a los repartidores. Cada solicitud necesita tu aprobación.","Con varios repartidores, cambia entre ellos por sus iniciales en Inicio."])],["Idioma, zona horaria y tema",o(["Ajustes › Idioma y región: portugués, inglés o español, y la zona horaria (automática del dispositivo).","Tema <b>Auto</b>: oscuro de noche (18 h a 6 h) y claro de día."])],["Privacidad y seguridad",o(["Lo que eliminas va a <b>Eliminados</b>. Nada desaparece solo.","<b>Eliminar mi perfil y datos</b> borra lo tuyo para siempre, con contraseña.","Los permisos los garantiza el servidor: nadie cambia lo que es del otro."])]]}}[a],n={pt:{ini:e?["O cartão do topo mostra só o que importa agora, com uma ilustração animada: chuva, calor, feriado ou pagamento recebido. Se houver mais de um aviso, toque na ilustração para ver o próximo.","Quando chega uma <b>Nova corrida</b>, o cartão pulsa e o alerta toca e vibra até você tocar na tela (no máximo 6 vezes).","Toque em <b>Sair para entrega</b>. Se não puder levar, toque em <b>Não posso</b>: o proprietário é avisado.","Em rota: <b>Navegar</b>, <b>Waze</b>, <b>Cliente</b> (envia o link de acompanhamento) e <b>Entreguei</b>.","Fez uma entrega que ainda não foi lançada? Toque em <b>Solicitar corrida</b>.","O resumo de hoje mostra as entregas feitas e quanto falta para a meta do dia."]:["O cartão do topo mostra só o que importa agora, com uma ilustração animada: feriado, chuva ou <b>Falta pagar a jornada</b>. Se houver mais de um aviso, toque na ilustração para ver o próximo.","Em <b>Falta pagar a jornada</b>, o botão <b>Registrar</b> abre o pagamento direto.","O botão <b>Nova corrida</b> fica sempre à mão. Quando alguém está em rota, aparece o mapa <b>Ao vivo</b>.","Você é avisado de cada etapa com som e vibração: saiu para entrega, km ajustado, entregue, não entregue ou não pode levar.","O resumo de hoje mostra só o essencial. Toque nele para ver os detalhes."],jor:["Toque em <b>Começar jornada</b> no cartão do topo: você fica <b>online</b> para o estabelecimento (bolinha verde), a tela fica acesa e o som liberado, para nenhum alerta passar.","Para encerrar, toque em <b>Jornada ativa</b>.","A jornada vai da virada até a virada seguinte (padrão 04:00). O proprietário ajusta em Ajustes › Negócio."],som:["A <b>Nova corrida</b> toca e vibra sem parar até o entregador aceitar ou recusar. No proprietário, o pedido de corrida e o “não pode levar” repetem até você tocar na tela; os demais avisos tocam uma vez.","Em Ajustes › <b>Som e vibração</b>, ligue ou desligue cada um e toque em um aviso para ouvir como soa.","No celular, o som começa a funcionar depois do primeiro toque na tela."],cor:["As corridas concluídas aparecem numa linha só: número, endereço e valor. Toque para ver mais.","Corridas antigas ficam guardadas; use as setas para trocar de dia.","Para registrar um pagamento, toque em <b>Registrar</b>, escolha a forma (Pix, Dinheiro, Transferência ou Outro) e, se quiser, anexe o comprovante."],gan:["O gráfico mostra a diária de cada jornada e a meta (tracejada).","Em <b>Metas</b>, toque em <b>Ajustar</b> e defina o lucro que você quer <b>por dia</b> e <b>no mês</b>. As barras ficam verdes quando a meta é batida.","<b>Combustível</b> fica dentro de Ganhos: atualize o preço do litro e, ao abastecer, digite só o valor pago.","Depois que o proprietário registra o pagamento, as corridas da jornada ficam travadas."],t:{jor:"Modo jornada",som:"Som e vibração",cor:"Corridas",gan:"Ganhos, metas e combustível"}},en:{ini:e?["The top card shows only what matters now, with an animated illustration: rain, heat, a holiday or a payout received. If there's more than one notice, tap the illustration to see the next.","When a <b>New delivery</b> arrives, the card pulses and the alert sounds and vibrates until you tap the screen (up to 6 times).","Tap <b>Head out</b>. If you can't take it, tap <b>Can't take it</b>: the owner is notified.","En route: <b>Navigate</b>, <b>Waze</b>, <b>Customer</b> (sends the tracking link) and <b>Delivered</b>.","Made a delivery that wasn't created yet? Tap <b>Request delivery</b>.","Today's summary shows deliveries done and how far you are from the daily goal."]:["The top card shows only what matters now, with an animated illustration: a holiday, rain or <b>Shift not paid yet</b>. If there's more than one notice, tap the illustration to see the next.","On <b>Shift not paid yet</b>, the <b>Record</b> button opens the payout right away.","The <b>New delivery</b> button is always at hand. When someone is en route, the <b>Live</b> map appears.","You're alerted at every step with sound and vibration: headed out, km adjusted, delivered, not delivered or can't take it.","Today's summary shows only the essentials. Tap it for details."],jor:["Tap <b>Start shift</b> on the top card: you go <b>online</b> for the business (green dot), the screen stays on and sound is unlocked, so no alert is missed.","To end it, tap <b>Shift active</b>.","A shift runs from one turnover to the next (default 04:00). The owner sets it in Settings › Business."],som:["<b>New delivery</b> rings and vibrates nonstop until the rider accepts or declines. For the owner, delivery requests and “can't take it” repeat until you tap the screen; other notices sound once.","In Settings › <b>Sound and vibration</b>, turn each on or off and tap a notice to hear it.","On phones, sound starts working after the first tap on the screen."],cor:["Completed deliveries show on a single line: number, address and amount. Tap for more.","Past deliveries are kept; use the arrows to change the day.","To record a payout, tap <b>Record</b>, pick the method (Pix, Cash, Transfer or Other) and attach a receipt if you like."],gan:["The chart shows each shift's pay and the goal (dashed).","Under <b>Goals</b>, tap <b>Adjust</b> and set how much you want to keep <b>per day</b> and <b>per month</b>. Bars turn green when a goal is reached.","<b>Fuel</b> is inside Earnings: update the price per liter and, when you refuel, type only the amount paid.","Once the owner records the payout, that shift's deliveries are locked."],t:{jor:"Shift mode",som:"Sound and vibration",cor:"Deliveries",gan:"Earnings, goals and fuel"}},es:{ini:e?["La tarjeta de arriba muestra solo lo importante ahora, con una ilustración animada: lluvia, calor, feriado o pago recibido. Si hay más de un aviso, toca la ilustración para ver el siguiente.","Cuando llega un <b>Nuevo envío</b>, la tarjeta late y la alerta suena y vibra hasta que tocas la pantalla (hasta 6 veces).","Toca <b>Salir a entregar</b>. Si no puedes llevarlo, toca <b>No puedo</b>: el dueño recibe el aviso.","En ruta: <b>Navegar</b>, <b>Waze</b>, <b>Cliente</b> (envía el enlace de seguimiento) y <b>Entregué</b>.","¿Hiciste una entrega que aún no se registró? Toca <b>Solicitar envío</b>.","El resumen de hoy muestra las entregas hechas y cuánto falta para la meta del día."]:["La tarjeta de arriba muestra solo lo importante ahora, con una ilustración animada: feriado, lluvia o <b>Falta pagar la jornada</b>. Si hay más de un aviso, toca la ilustración para ver el siguiente.","En <b>Falta pagar la jornada</b>, el botón <b>Registrar</b> abre el pago directamente.","El botón <b>Nuevo envío</b> siempre está a mano. Cuando alguien está en ruta, aparece el mapa <b>En vivo</b>.","Recibes aviso con sonido y vibración en cada paso: salió a entregar, km ajustado, entregado, no entregado o no puede llevarlo.","El resumen de hoy muestra solo lo esencial. Tócalo para ver los detalles."],jor:["Toca <b>Iniciar jornada</b> en la tarjeta de arriba: quedas <b>en línea</b> para el negocio (punto verde), la pantalla queda encendida y el sonido habilitado, para que no se pierda ninguna alerta.","Para terminar, toca <b>Jornada activa</b>.","La jornada va de un cambio al siguiente (por defecto 04:00). El dueño lo ajusta en Ajustes › Negocio."],som:["El <b>Nuevo envío</b> suena y vibra sin parar hasta que el repartidor acepta o rechaza. Para el dueño, la solicitud de envío y el “no puede llevarlo” se repiten hasta que tocas la pantalla; los demás avisos suenan una vez.","En Ajustes › <b>Sonido y vibración</b>, activa o desactiva cada uno y toca un aviso para escucharlo.","En el móvil, el sonido funciona después del primer toque en la pantalla."],cor:["Los envíos completados aparecen en una sola línea: número, dirección y valor. Toca para ver más.","Los envíos anteriores quedan guardados; usa las flechas para cambiar de día.","Para registrar un pago, toca <b>Registrar</b>, elige la forma (Pix, Efectivo, Transferencia u Otro) y, si quieres, adjunta el comprobante."],gan:["El gráfico muestra la diaria de cada jornada y la meta (punteada).","En <b>Metas</b>, toca <b>Ajustar</b> y define cuánto quieres que te quede <b>por día</b> y <b>en el mes</b>. Las barras se ponen verdes al alcanzar la meta.","El <b>Combustible</b> está dentro de Ganancias: actualiza el precio por litro y, al cargar, escribe solo el valor pagado.","Cuando el dueño registra el pago, los envíos de la jornada quedan bloqueados."],t:{jor:"Modo jornada",som:"Sonido y vibración",cor:"Envíos",gan:"Ganancias, metas y combustible"}}}[a];{const r=i.itens,d=h=>r.findIndex(v=>v[0]===h);r[0]=[r[0][0],o(n.ini)];const c=d({pt:"Ganhos e meta",en:"Earnings and goal",es:"Ganancias y meta"}[a]);c>=0&&r.splice(c,2,[n.t.gan,o(n.gan)]);const p=d({pt:"Jornada",en:"Shift",es:"Jornada"}[a]);p>=0&&r.splice(p,1),r.splice(1,0,[n.t.jor,o(n.jor)],[n.t.som,o(n.som)],[n.t.cor,o(n.cor)]);const m={pt:[["Etapas da entrega",["Saiu para entrega → <b>Cheguei</b> → <b>Concluir entrega</b>.","Quando o entregador sai, o link de acompanhamento é criado sozinho. O proprietário envia ao cliente pelo botão <b>Enviar acompanhamento</b>, na conversa do próprio estabelecimento; o botão <b>Cliente</b> do entregador fica como reserva.","Ao tocar em Cheguei, o estabelecimento é avisado e o cliente vê no link de acompanhamento que o entregador chegou.","No link, o cliente pode deixar uma <b>gorjeta por Pix</b> (QR Code ou copia e cola) direto para o entregador, que é avisado e vê as gorjetas em Ganhos. Cadastre a chave Pix em Meu cadastro; prefira a chave aleatória.","Depois da entrega, o cliente avalia com estrelas. O proprietário vê a média e os comentários em Equipe; o entregador vê a própria média em Ganhos.","A distância é sempre contada a partir do estabelecimento."]],["Problemas e emergência",["Com o SOS ativo, o proprietário acompanha a localização do entregador ao vivo, com o endereço aproximado para informar ao atendente, liga para SAMU, Bombeiros ou Polícia com um toque e decide sobre a corrida: avisar o cliente, enviar outro entregador ou cancelar.","Na corrida, toque em <b>Problema</b> para escolher o motivo (cliente não atende, endereço não encontrado, pedido danificado…). O outro lado recebe um alerta que repete até ser visto, e a corrida fica marcada.","O botão <b>SOS</b> fica ao lado de Começar jornada; acionado, o cartão do topo do proprietário fica vermelho e pisca até o entregador tocar em Estou bem. Ele traz: ligações de emergência com um toque (no Brasil, 192, 193, 190 e 191) e <b>Preciso de ajuda</b>, que avisa o estabelecimento e o seu contato de emergência com a sua localização.","Cadastre o contato de emergência em Meu cadastro."]],["Forma de pagamento",["No combinado da tabela, escolha <b>Por km</b>, <b>Fixo</b> ou <b>Fixo + km</b>.","O fixo pode ser por dia, por semana ou por mês. Por dia, ele entra no valor de cada jornada; por semana ou mês, aparece o cartão <b>Salário</b> para registrar e acompanhar o pagamento.","Como a tabela, a forma de pagamento só muda com o aceite dos dois."]],["Endereço do negócio",["Em Ajustes › Negócio, escolha primeiro <b>País</b>, <b>UF</b> e <b>Cidade</b>: o mapa de todos passa a abrir na sua cidade. Depois, logradouro, número e bairro. O <b>CEP</b> é opcional e, no Brasil, preenche rua e bairro sozinho.","No endereço do cliente, a cidade vem do negócio; a busca fica dentro dela.","Em <b>Marcar partida no mapa</b>, toque na lupa ou em Enter para buscar o endereço; digitar e corrigir não dispara a busca. Se o número não estiver no mapa, o app marca a rua: arraste o ponto até a porta e salve."]],["Mensagens do cartão",["O cartão do topo mostra o que importa agora, com base na sua cidade: calor, sol forte, frio, vento, chuva à noite, datas comemorativas do país e da região (como o São João no Nordeste) e dicas tiradas das suas próprias entregas.","No máximo 3 mensagens por vez. Toque no texto de uma mensagem para dispensá-la até amanhã; toque na ilustração para ver a próxima.","Em jornada, nos dias quentes, o app lembra de beber água a cada 2 horas e sugere uma pausa a cada 4 horas."]],["Comunicados",["Em Ajustes › Comunicados, o proprietário escreve uma mensagem para toda a equipe ou para um entregador, escolhe a cor, a ilustração e o período. Ela aparece no cartão do topo do app de quem recebe.","No próprio cartão do Início: o ícone de megafone cria um comunicado, e tocar no texto de um comunicado abre para editar ou excluir.","Tipo <b>Reunião</b>: com dia e horário. A equipe responde <b>Vou</b> ou <b>Não vou</b> no cartão, você vê as confirmações, e todos recebem um lembrete 1 hora antes.","Na Análise › Equipe, o entregador mais bem avaliado ganha o botão <b>Homenagear como entregador do mês</b>, que já prepara o comunicado."]],["Distribuição automática",["Em Ajustes › Equipe, ligue <b>Distribuição automática</b>. A corrida vai para o entregador da vez: online, livre e com menos corridas hoje.","Se ele tocar em <b>Não posso</b>, estiver em rota, ficar off-line ou não responder em 2 minutos, a corrida passa sozinha para o próximo.","Se ninguém puder, você recebe o alerta e escolhe: <b>Passar para…</b>, <b>Reenviar</b> ou <b>Cancelar</b>.","Funciona com o app do proprietário aberto (no celular ou no computador do balcão).","Quem trabalha para mais de um negócio escolhe, em Começar jornada, para qual está online."]],["Entrar na conta",["Você pode entrar com o seu usuário (ex.: mesak.sarasate), e-mail, CPF, CNPJ ou celular."]],["Cópia dos seus dados",["Em Ajustes › Privacidade e segurança, toque em <b>Baixar cópia dos meus dados</b> para guardar um arquivo com tudo o que é seu.","Ao excluir o perfil, tudo o que é seu é apagado e o usuário, o e-mail e o CPF ficam livres para uma conta nova. As corridas feitas com um parceiro ficam só no histórico dele."]]],en:[["Delivery steps",["Headed out → <b>Arrived</b> → <b>Complete delivery</b>.","When the rider heads out, the tracking link is created automatically. The owner sends it to the customer with <b>Send tracking</b>, in the business's own chat; the rider's <b>Customer</b> button stays as a backup.","Tapping Arrived notifies the business, and the customer sees on the tracking link that the rider has arrived.","On the link, the customer can leave a <b>Pix tip</b> (QR code or copy-paste) straight to the rider, who is notified and sees tips in Earnings. Add your Pix key in My profile; a random key is best.","After delivery, the customer rates with stars. The owner sees the average and comments in Team; the rider sees their own average in Earnings.","Distance is always counted from the business."]],["Problems and emergency",["With SOS on, the owner follows the rider's live location, with an approximate address to tell the operator, calls emergency services with one tap and decides about the delivery: tell the customer, send another rider or cancel.","On a delivery, tap <b>Problem</b> to pick the reason (customer doesn't answer, address not found, damaged order…). The other side gets an alert that repeats until seen, and the delivery is flagged.","The <b>SOS</b> button sits next to Start shift; once triggered, the owner's top card turns red and flashes until the rider taps I'm OK. It offers: one-tap emergency calls and <b>I need help</b>, which alerts the business and your emergency contact with your location.","Add your emergency contact in My profile."]],["Payment method",["In the rate agreement, choose <b>Per km</b>, <b>Fixed</b> or <b>Fixed + km</b>.","The fixed amount can be per day, week or month. Per day, it is added to each shift; per week or month, a <b>Salary</b> card lets you record and follow the payment.","Like the rate table, the payment method only changes when both accept."]],["Business address",["In Settings › Business, pick <b>Country</b>, <b>State</b> and <b>City</b> first: everyone's map then opens on your city. Then street, number and neighborhood. The <b>ZIP code</b> is optional.","For the customer's address, the city comes from the business; the search stays inside it.","In <b>Set start point on map</b>, tap search or Enter to look up the address; typing and fixing doesn't trigger it. If the number isn't on the map, the app marks the street: drag the pin to the door and save."]],["Top card messages",["The top card shows what matters now, based on your city: heat, strong sun, cold, wind, rain at night, holidays of your country and region, and tips from your own deliveries.","At most 3 messages at a time. Tap a message's text to dismiss it until tomorrow; tap the illustration to see the next one.","On a shift, on hot days, the app reminds you to drink water every 2 hours and suggests a break every 4 hours."]],["Announcements",["In Settings › Announcements, the owner writes a message for the whole team or one rider, with color, illustration and dates. It shows on the top card of whoever receives it.","On the Home card itself: the megaphone icon creates an announcement, and tapping an announcement's text opens it to edit or delete.","<b>Meeting</b> type: with day and time. The team answers <b>I'll be there</b> or <b>Can't make it</b> on the card, you see the confirmations, and everyone gets a reminder 1 hour before.","In Analytics › Team, the best-rated rider gets an <b>Honor as rider of the month</b> button that prepares the announcement."]],["Automatic dispatch",["In Settings › Team, turn on <b>Automatic dispatch</b>. The delivery goes to the rider whose turn it is: online, free and with the fewest deliveries today.","If they tap <b>Can't take it</b>, are on a delivery, go offline or don't answer in 2 minutes, it moves to the next one by itself.","If nobody can, you get the alert and choose: <b>Pass to…</b>, <b>Resend</b> or <b>Cancel</b>.","It runs while the owner's app is open (phone or counter computer).","Riders with more than one business choose, in Start shift, which one they are online for."]],["Signing in",["You can sign in with your username (e.g. mesak.sarasate), email, ID number or mobile."]],["A copy of your data",["In Settings › Privacy and security, tap <b>Download a copy of my data</b> to keep a file with everything that is yours.","When you delete your profile, everything that is yours is erased, and the username, email and ID number are free for a new account. Deliveries made with a partner stay only in their history."]]],es:[["Etapas de la entrega",["Salió a entregar → <b>Llegué</b> → <b>Completar entrega</b>.","Cuando el repartidor sale, el enlace de seguimiento se crea solo. El dueño lo envía al cliente con <b>Enviar seguimiento</b>, en el chat del propio negocio; el botón <b>Cliente</b> del repartidor queda de respaldo.","Al tocar Llegué, el negocio recibe el aviso y el cliente ve en el enlace de seguimiento que el repartidor llegó.","En el enlace, el cliente puede dejar una <b>propina por Pix</b> (código QR o copiar y pegar) directo al repartidor, que recibe el aviso y ve las propinas en Ganancias. Registra tu clave Pix en Mi registro; mejor la clave aleatoria.","Después de la entrega, el cliente valora con estrellas. El dueño ve el promedio y los comentarios en Equipo; el repartidor ve su propio promedio en Ganancias.","La distancia siempre se cuenta desde el negocio."]],["Problemas y emergencia",["Con el SOS activo, el dueño sigue la ubicación del repartidor en vivo, con la dirección aproximada para decirla al operador, llama a emergencias con un toque y decide sobre el envío: avisar al cliente, enviar otro repartidor o cancelar.","En el envío, toca <b>Problema</b> para elegir el motivo (el cliente no contesta, dirección no encontrada, pedido dañado…). El otro lado recibe una alerta que se repite hasta verla, y el envío queda marcado.","El botón <b>SOS</b> está junto a Iniciar jornada; al activarlo, la tarjeta de arriba del dueño se pone roja y parpadea hasta que el repartidor toca Estoy bien. Ofrece: llamadas de emergencia con un toque y <b>Necesito ayuda</b>, que avisa al negocio y a tu contacto de emergencia con tu ubicación.","Registra tu contacto de emergencia en Mi registro."]],["Forma de pago",["En el acuerdo de la tabla, elige <b>Por km</b>, <b>Fijo</b> o <b>Fijo + km</b>.","El fijo puede ser por día, semana o mes. Por día, se suma a cada jornada; por semana o mes, aparece la tarjeta <b>Salario</b> para registrar y seguir el pago.","Como la tabla, la forma de pago solo cambia con la aceptación de los dos."]],["Dirección del negocio",["En Ajustes › Negocio, elige primero <b>País</b>, <b>Estado</b> y <b>Ciudad</b>: el mapa de todos se abre en tu ciudad. Luego calle, número y barrio. El <b>código postal</b> es opcional.","En la dirección del cliente, la ciudad viene del negocio; la búsqueda queda dentro de ella.","En <b>Marcar salida en el mapa</b>, toca la lupa o Enter para buscar la dirección; escribir y corregir no inicia la búsqueda. Si el número no está en el mapa, marca la calle: arrastra el punto hasta la puerta y guarda."]],["Mensajes de la tarjeta",["La tarjeta superior muestra lo importante ahora, según tu ciudad: calor, sol fuerte, frío, viento, lluvia de noche, fechas del país y la región, y consejos de tus propias entregas.","Máximo 3 mensajes a la vez. Toca el texto de un mensaje para ocultarlo hasta mañana; toca la ilustración para ver el siguiente.","En jornada, en días calurosos, la app recuerda beber agua cada 2 horas y sugiere una pausa cada 4 horas."]],["Comunicados",["En Ajustes › Comunicados, el dueño escribe un mensaje para todo el equipo o un repartidor, con color, ilustración y fechas. Aparece en la tarjeta superior de quien lo recibe.","En la propia tarjeta del Inicio: el ícono de megáfono crea un comunicado, y tocar el texto de un comunicado lo abre para editar o eliminar.","Tipo <b>Reunión</b>: con día y hora. El equipo responde <b>Voy</b> o <b>No voy</b> en la tarjeta, ves las confirmaciones y todos reciben un recordatorio 1 hora antes.","En Análisis › Equipo, el repartidor mejor valorado tiene el botón <b>Homenajear como repartidor del mes</b>, que prepara el comunicado."]],["Distribución automática",["En Ajustes › Equipo, activa <b>Distribución automática</b>. El envío va al repartidor de turno: en línea, libre y con menos envíos hoy.","Si toca <b>No puedo</b>, está en ruta, se desconecta o no responde en 2 minutos, el envío pasa solo al siguiente.","Si nadie puede, recibes la alerta y eliges: <b>Pasar a…</b>, <b>Reenviar</b> o <b>Cancelar</b>.","Funciona con la app del dueño abierta (celular o computadora del mostrador).","Quien trabaja para más de un negocio elige, en Comenzar jornada, para cuál está en línea."]],["Entrar a la cuenta",["Puedes entrar con tu usuario (ej.: mesak.sarasate), correo, documento o celular."]],["Copia de tus datos",["En Ajustes › Privacidad y seguridad, toca <b>Descargar copia de mis datos</b> para guardar un archivo con todo lo tuyo.","Al eliminar el perfil, todo lo tuyo se borra y el usuario, el correo y el documento quedan libres para una cuenta nueva. Los envíos hechos con un socio quedan solo en su historial."]]]}[a];r.splice(4,0,...m.filter((h,v)=>!(e&&(v===2||v===5||v===6))).map(([h,v])=>[h,o(v)]))}return`<div class="card" data
