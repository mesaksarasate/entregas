<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E2328">
<title>Persuadir Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Young+Serif&display=swap">
<style>
:root{--bg:#1E2328;--fg:#F3F4F1;--muted:#AEB4BB;--lima:#D7F04A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:420px;width:100%;display:flex;flex-direction:column;gap:20px;text-align:left}
.marca{display:flex;align-items:baseline;gap:8px}
.marca b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:30px;color:var(--lima)}
.marca span{font-size:20px;font-weight:500;color:var(--muted)}
h1{margin:12px 0 0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em}
p{margin:0;font-size:16px;line-height:24px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="marca"><b>Persuadir</b><span>Entregas</span></div>
  <h1>Esta versão foi encerrada.</h1>
  <p>Obrigado por ter usado o Persuadir Entregas.</p>
</main>
<script>
/* apaga a cópia guardada da versão antiga neste aparelho (sem mexer no app novo, em /app/) */
try{
  if("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if(r.scope===location.origin+"/") r.unregister(); }));
  if(window.caches) caches.keys().then(ks=>ks.filter(k=>!k.startsWith("pe-app")).forEach(k=>caches.delete(k)));
  ["pe-jornada","pe-jorn-ini"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
}catch(e){}
</script>
</body>
</html>
