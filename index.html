<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: app de uma coluna para celular, família visual Persuadir (Entregas = alta visibilidade: grafite e lima); abas fixas no rodapé; cartão de rota estilo mapa */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E8EAE5; --line:#DCDFD9;
  --fg:#16191C; --muted:#5F666D;
  --accent:#1E2328; --accent-ink:#D7F04A; --accent-soft:#E9F3C2; --sig:#B8D430; --brand-c:#2E3236;
  --route:#1a73e8; --route-casing:#0d55b8; --route-ink:#ffffff; --pin:#d93025;
  --good:#3E8E2F; --good-soft:#E1F0DA; --bad:#C2415B; --bad-soft:#F7DDE3; --warn:#5E6B00; --warn-soft:#EEF3C8;
  --map-bg:#E8EAED; --map-block:#F3F4F6; --map-road:#ffffff; --map-park:#DDEBCF; --grid:#DCDFD9;
  --shadow:0 1px 2px rgba(20,25,28,.06),0 8px 24px rgba(20,25,28,.06); --seg-on:#FFFFFF;
  --f-brand:"Young Serif",Georgia,"Times New Roman",serif;
  --f-display:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#16191C; --surface-2:#1F2327; --line:#2A2F34;
  --fg:#EEF0EC; --muted:#98A0A6;
  --accent:#D7F04A; --accent-ink:#121417; --accent-soft:#2A3214; --sig:#D7F04A; --brand-c:#E3E5E8;
  --route:#8ab4f8; --route-casing:#3d6fc2; --route-ink:#0b1a33; --pin:#f28b82;
  --good:#A6D96A; --good-soft:#24331A; --bad:#F0738B; --bad-soft:#3A1C24; --warn:#D7F04A; --warn-soft:#2A3214;
  --map-bg:#1B1D21; --map-block:#222428; --map-road:#30333A; --map-park:#1E2A18; --grid:#2A2F34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --seg-on:#2A2F34; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#16191C; --surface-2:#1F2327; --line:#2A2F34;
  --fg:#EEF0EC; --muted:#98A0A6;
  --accent:#D7F04A; --accent-ink:#121417; --accent-soft:#2A3214; --sig:#D7F04A; --brand-c:#E3E5E8;
  --route:#8ab4f8; --route-casing:#3d6fc2; --route-ink:#0b1a33; --pin:#f28b82;
  --good:#A6D96A; --good-soft:#24331A; --bad:#F0738B; --bad-soft:#3A1C24; --warn:#D7F04A; --warn-soft:#2A3214;
  --map-bg:#1B1D21; --map-block:#222428; --map-road:#30333A; --map-park:#1E2A18; --grid:#2A2F34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --seg-on:#2A2F34; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-feature-settings:"cv11" 1;font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.85rem;line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"cv11" 1,"zero" 1}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}

/* Topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 0}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .word{display:flex;align-items:baseline;gap:8px;line-height:1}
.brand .word b{font-family:var(--f-brand);font-weight:400;font-size:1.7rem;color:var(--brand-c);letter-spacing:-.01em}
.brand .word span{font-size:.875rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.acct{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.acct .av{position:relative;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-brand);font-size:1.7rem;border:0;padding:0;cursor:pointer}
.acct .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.acct .av .cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--fg);border:2px solid var(--bg);display:grid;place-items:center;box-shadow:var(--shadow)}
.acct .av .cam svg.i{width:14px;height:14px}
.acct .user{display:block;color:var(--muted);font-size:.86rem;font-weight:600;margin-top:2px}
.onb{position:fixed;inset:0;z-index:25;overflow-y:auto;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(900px 520px at 15% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 420px at 110% 110%,var(--accent-soft),transparent 55%),var(--bg)}
.onb-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 24px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;text-align:center}
.onb-card .word{display:flex;align-items:baseline;justify-content:center;gap:.77rem}
.onb-card .word b{font-family:var(--f-brand);font-weight:400;font-size:2.6rem;color:var(--brand-c);line-height:1;letter-spacing:-.01em}
.onb-card .word span{font-size:1.35rem;font-weight:600;letter-spacing:.01em;color:var(--muted)}
.onb-card .ic{width:76px;height:76px;margin:0 auto;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.onb-card .ic svg.i{width:40px;height:40px}
.onb-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;font-size:.92rem}
.onb-card li{display:flex;gap:10px;align-items:flex-start}
.onb-card li svg.i{width:18px;height:18px;color:var(--good);margin-top:2px}
@media (prefers-reduced-motion:no-preference){.onb-card{animation:up .45s cubic-bezier(.2,.9,.3,1)}}
.onb-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px}
.onb-tabs button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:800;color:var(--muted);cursor:pointer}
.onb-tabs button[aria-selected="true"]{background:var(--seg-on);color:var(--fg);box-shadow:var(--shadow)}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg);font-weight:800;font-size:1rem}
.rolepick button span.ic2{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.rolepick button span.ic2 svg.i{width:30px;height:30px}
.rolepick button small{font-weight:600;color:var(--muted);font-size:.78rem}
.rolepick button:hover,.rolepick button:focus-visible{border-color:var(--accent)}
.rolepick button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rolepick button[aria-checked="true"] span.ic2{background:var(--accent);color:var(--accent-ink)}
.onb-form{display:flex;flex-direction:column;gap:12px;text-align:left}
.field-err{color:var(--bad);font-size:.78rem;font-weight:700}
.field-ok{color:var(--good);font-size:.78rem;font-weight:700}
.acct b{display:block;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.acct .role{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:.82rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.acct .role svg.i{width:15px;height:15px}
.brand .who{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--muted)}
.brand .who svg.i{width:16px;height:16px;color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--fg)}
.iconbtn:disabled{opacity:.35;cursor:default}
.bellbtn{position:relative}
.bbadge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.nitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%;color:var(--fg);cursor:pointer}
.nitem.new{border-color:var(--accent);background:var(--accent-soft)}
.nitem .ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.nitem small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.diff td.old{color:var(--muted);text-decoration:line-through}
.diff td.chg{color:var(--accent);font-weight:800}
.diff tr.add td{color:var(--good)} .diff tr.del td{color:var(--bad);text-decoration:line-through}

/* Elementos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip svg.i{width:15px;height:15px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.route{background:var(--route);color:var(--route-ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.note{padding:10px 14px;border-radius:12px;background:var(--surface-2);font-size:.9rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--fg);text-align:center;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.route{background:var(--route);border-color:var(--route);color:var(--route-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem;border-radius:11px}
.btn.xl{min-height:60px;font-size:1.1rem;border-radius:18px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1 1 140px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 0}

label{display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],input[type=tel],input[type=url],input[type=email],select,textarea{
  background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 13px;font-size:1rem;color:var(--fg);width:100%;min-width:0;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--route);outline:none;background:var(--surface)}
input::placeholder{color:var(--muted);opacity:.8}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.row>.narrow{flex:0 1 110px}
.bigin input{font-family:var(--f-display);font-size:1.7rem;font-weight:800;padding:8px 13px;font-variant-numeric:tabular-nums}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* Seletor por ícones */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.picker button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.82rem;color:var(--fg)}
.picker button svg.i{width:26px;height:26px}
.picker button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--fg);box-shadow:var(--shadow)}

/* Home */
.hello h1{font-size:2rem}
.shop{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.shop .ic{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.shop .ic svg.i{width:28px;height:28px}
.shop h2{font-size:1.3rem;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr) minmax(0,1.35fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.stat .eyebrow{font-size:.68rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--f-display);font-size:clamp(1.15rem,5vw,1.45rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stats .stat:last-child .v{white-space:nowrap}
.stat.hl{background:var(--accent-soft)}
.stat.hl .v{color:var(--accent)}

/* Notificações */
.notif{border-radius:18px;background:var(--route);color:var(--route-ink);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.notif h3{display:flex;align-items:center;gap:8px}
.notif ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.notif .btn{background:var(--route-ink);color:var(--route);border-color:var(--route-ink);min-height:40px}
@media (prefers-reduced-motion:no-preference){.notif{animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}@keyframes drop{from{transform:translateY(-10px);opacity:0}}}

/* Cartão de rota */
.routecard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.map{display:block;width:100%;height:auto}
.m-bg{fill:var(--map-bg)} .m-block{fill:var(--map-block)} .m-park{fill:var(--map-park)}
.m-road{stroke:var(--map-road);stroke-linecap:round;fill:none}
.m-casing{fill:none;stroke:var(--route-casing);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.m-route{fill:none;stroke:var(--route);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.m-a{fill:var(--surface);stroke:var(--route-casing);stroke-width:3.5}
.m-pin{fill:var(--pin);stroke:var(--surface);stroke-width:1.5}
.m-pindot{fill:var(--surface)}
.m-label{font:700 11px var(--f-body);fill:var(--fg);paint-order:stroke;stroke:var(--map-bg);stroke-width:4px;stroke-linejoin:round}
.m-pill{fill:var(--route)} .m-pilltx{font:800 12px var(--f-body);fill:var(--route-ink)}
.legs{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.eta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eta b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums}
.eta span.d{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.eta .price{margin-left:auto;font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.stops{display:grid;grid-template-columns:22px 1fr;gap:0 10px;font-size:.92rem}
.stops .mk{display:flex;flex-direction:column;align-items:center}
.stops .a{width:14px;height:14px;border-radius:50%;border:3px solid var(--route-casing);background:var(--surface);margin-top:3px}
.stops .ln{flex:1;width:0;border-left:2px dotted var(--muted);margin:3px 0;min-height:14px}
.stops .b{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pin);margin-top:4px}
.stops .tx{min-width:0;overflow-wrap:anywhere;padding-bottom:8px}
.stops .tx small{display:block;color:var(--muted);font-size:.8rem}

/* Corridas */
.runs{display:flex;flex-direction:column;gap:10px}
.run{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.run .head{display:grid;grid-template-columns:40px 1fr auto;gap:4px 12px;padding:12px 14px;align-items:center;width:100%;background:none;border:0;text-align:left;cursor:pointer;color:var(--fg)}
.run .n{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.run.rota .n{background:var(--route);color:var(--route-ink)}
.run.ok .n{background:var(--good-soft);color:var(--good)}
.run.off{opacity:.65}
.run .addr{font-weight:700;overflow-wrap:anywhere;line-height:1.25;display:block}
.run .meta{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.run .val{text-align:right;font-variant-numeric:tabular-nums}
.run .val b{display:block;font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.run .val span{font-size:.8rem;color:var(--muted)}
.run .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a,.thumbs .th{width:76px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface-2);font-size:.75rem;font-weight:700;color:var(--muted);text-decoration:none;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:.8rem;cursor:pointer;line-height:1}

.paid{display:flex;flex-direction:column;gap:10px;border-radius:18px;padding:16px;background:var(--good-soft);color:var(--good)}
.paid .amt{font-family:var(--f-display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.paid .fg{color:var(--fg)}

/* Tabela */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.tbl tr.prov td{color:var(--muted)}
.tbl input{padding:8px 9px;font-size:.95rem}
.scroll{overflow-x:auto}
pre.summary{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:12px;padding:12px;font-family:var(--f-body);font-size:.88rem;margin:0;max-height:300px;overflow:auto}

/* Receita */
.chart{display:block;width:100%;height:auto}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-axis{font:600 10px var(--f-body);fill:var(--muted)}
.c-bar{fill:var(--accent)}
.c-hit{fill:transparent;cursor:pointer}
.c-col:hover .c-bar,.c-col:focus .c-bar{fill:var(--route)}
.c-col:focus{outline:none}
.c-avg{stroke:var(--fg);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55}
.c-lbl{font:800 11px var(--f-body);fill:var(--fg)}
.c-tip{font:700 12px var(--f-body);fill:var(--fg)}
.nightrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;cursor:pointer;width:100%;color:var(--fg);align-items:center}

/* Manual */
details.man{border-top:1px solid var(--line);padding-block:12px}
details.man:first-of-type{border-top:0;padding-top:0}
details.man summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.man summary::after{content:"+";color:var(--muted);font-weight:800}
details.man[open] summary::after{content:"–"}
details.man p,details.man ul{margin:8px 0 0;color:var(--muted);font-size:.92rem}
details.man ul{padding-left:18px}

/* Telas por cima */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:6px 10px;z-index:2}
.sheet .bar h1{font-size:1.5rem;flex:1}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]){animation:up .28s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(24px)}}}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;padding:7px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:var(--muted);cursor:pointer;min-width:0}
.tabs button svg.i{width:23px;height:23px;padding:2px 12px;box-sizing:content-box;border-radius:999px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg.i{background:var(--accent-soft)}

.toast{z-index:40!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:14px;font-weight:700;font-size:.9rem}
.simbar .btn{min-height:36px;background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);font-size:.85rem;padding:6px 12px}
fieldset.plain{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:14px}
fieldset.plain:disabled{opacity:.6}
.prog{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:5px;background:var(--warn)}
.prog.ok i{background:var(--good)}
.c-area{fill:var(--accent);opacity:.14}
.c-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-meta{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-dasharray:5 4;opacity:.6}
.c-dot{stroke:var(--surface);stroke-width:2}
.c-dot.ok{fill:var(--good)} .c-dot.low{fill:var(--bad)} .c-dot.neu{fill:var(--accent)}
.c-fill{stroke:none;opacity:.28}.c-fill.good{fill:var(--good)}.c-fill.bad{fill:var(--bad)}
.c-meta.solid{stroke:var(--bad);stroke-dasharray:none;opacity:1;stroke-width:2}
.legend i.ln{width:18px;height:3px;border-radius:2px}.legend i.ln.a{background:var(--accent)}.legend i.ln.b{background:var(--bad)}.legend i.ln.dash{height:0;border-top:2px dashed var(--fg);opacity:.6}.legend i.bx{width:10px;height:10px;border-radius:3px;opacity:.45}.legend i.bx.good{background:var(--good)}.legend i.bx.bad{background:var(--bad)}
.c-col:hover .c-dot,.c-col:focus .c-dot{stroke:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lucrow{display:flex;align-items:center;gap:10px;padding:0 14px 12px}
.lucrow label{flex-direction:row;align-items:center;gap:8px;flex:1;color:var(--fg)}
.lucrow input{max-width:150px;padding:9px 11px;font-weight:700;font-variant-numeric:tabular-nums}
.lucrow .ok{color:var(--good)}
.result{display:flex;flex-direction:column;gap:8px}
.result .ln{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.result .tot{border-top:1px solid var(--line);padding-top:8px;font-family:var(--f-display);font-size:1.35rem;font-weight:800}
.contact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.contact b{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:22px 16px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty svg.i{width:40px;height:40px;opacity:.7}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.ctr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--fg)}
.ctr .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox .lb-in{max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;color:#fff}
.lightbox img{max-width:100%;max-height:calc(100vh - 32px);border-radius:12px;object-fit:contain}
.lightbox>.btn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.convite{font-size:30px;font-weight:700;letter-spacing:.25em;text-align:center;padding:12px;border-radius:12px;background:var(--accent-soft,rgba(168,75,20,.1));color:var(--accent);margin:4px 0 8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);box-shadow:none}

/* Mapa real (OpenStreetMap) */
.lmap{height:230px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg);position:relative;z-index:0}
.lmap.tall{height:min(58vh,440px)}
.lmap.sm{height:170px}
.lmap .leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted)}
.lmap .leaflet-control-attribution a{color:var(--muted)}
.lmap .leaflet-bar a{background:var(--surface);color:var(--fg);border-color:var(--line)}
:root[data-theme="dark"] .lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}}
.lf-route{stroke:var(--route)} .lf-casing{stroke:var(--route-casing)}
.mk-a,.mk-b,.mk-moto{background:none;border:0}
.mk-a i{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--accent);color:var(--accent-ink);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mk-a svg.i{width:16px;height:16px}
.mapfs{position:absolute;left:10px;top:10px;z-index:5;width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
.mapfs svg.i{width:18px;height:18px}
.lmap.full{position:fixed!important;inset:0;z-index:80;height:100dvh!important;border-radius:0!important;border:0!important;margin:0}
.lmap.full .mapfs{top:calc(12px + env(safe-area-inset-top,0px))}
html.mapfull,html.mapfull body{overflow:hidden}
.lmap .maplibregl-ctrl-group{border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25);background:var(--surface)}
.lmap .maplibregl-ctrl-group button{width:38px;height:38px}
.lmap .maplibregl-ctrl-attrib{font-size:10px}
.lmap .maplibregl-canvas{outline:none}
.run .body .lmap.sm,.ped .lmap.sm{border-radius:14px}
.mk-b svg{display:block;width:30px;height:40px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.mk-moto i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk-moto svg.i{width:18px;height:18px}
.geoinfo{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.9rem}
.geoinfo b{font-variant-numeric:tabular-nums}
.ped{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ped.novo{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ped .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ped .top2 b{display:block;overflow-wrap:anywhere}
.trk{min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:16px;max-width:560px;margin:0 auto}
.trk .lmap{height:min(56vh,460px)}
.trk .st{font-size:1.35rem;font-weight:700;line-height:1.25}

/* Início narrativo (proprietário e entregador) */
#globalNote:empty,#simBar:empty,#notifBox:empty{display:none}
.hero{display:flex;flex-direction:column;gap:4px;padding:2px 2px 0}
.hero .hi{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;font-weight:500}
.hero .say{margin:0;font-size:1.6rem;line-height:1.2;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.hero .say em{font-style:normal;background:linear-gradient(transparent 60%,var(--accent-soft) 60%);padding:0 2px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:32px;padding:0 11px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none}
.pill b{color:var(--fg);font-variant-numeric:tabular-nums}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
button.pill{cursor:pointer;font-family:inherit}
.pill.warn{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.nx{background:#1E2328;color:#F2F4EF;border:1px solid #2E353C;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:nxIn .35s ease-out both}
.nx.new{animation:nxIn .35s ease-out both,ring 1.8s ease-out .4s infinite}
.nx .k{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.74rem;font-weight:700;color:#D7F04A;text-transform:uppercase;letter-spacing:.05em}
.nx .k i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#D7F04A;margin-right:6px;animation:blink 1s infinite}
.nx .t{font-size:1.2rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.nx .s{font-size:.84rem;color:#B9C0C6;margin-top:2px}
.nx .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;color:#F2F4EF;text-transform:none;letter-spacing:0}
.nx .btn{border:0;min-height:48px}
.nx .btn.go{background:#D7F04A;color:#1E2328}
.nx .btn.ghost{background:#2E343A;color:#F2F4EF}
.nx .lmap{border-color:#2E353C}
.nx .row3{display:flex;gap:8px}.nx .row3 .btn{flex:1 1 0;min-width:0;padding-inline:8px}
.nx .mini{display:flex;flex-direction:column}
.nx .mini>div{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #2E353C;font-size:.9rem}
.nx .mini>div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx .mini .x{background:none;border:0;color:#B9C0C6;font:600 .8rem var(--f-body);cursor:pointer;padding:6px}
.live{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;animation:nxIn .35s ease-out both}
.live .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-size:.86rem;color:var(--muted)}
.live .hd b{color:var(--fg)}
.live .lmap{border:0;border-radius:0}
.live .ft{display:flex;justify-content:space-between;gap:10px;padding:12px 14px 6px;font-size:.88rem}
.live .ft b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(62,142,47,.45);display:inline-block;margin-right:8px;animation:pul 1.6s infinite}
.av2{width:28px;height:28px;border-radius:9px;background:var(--surface-2);display:inline-grid;place-items:center;font-size:.7rem;font-weight:800;color:var(--fg);flex:none}
.pbar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:0 14px 14px}
.pbar i{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .6s}
.calm{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;animation:nxIn .35s ease-out both}
.calm svg.ill{width:132px;height:92px}
.calm .ill .o{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 16px 4px}
.tl h2{font-size:1rem;margin-bottom:8px}
.ev{display:grid;grid-template-columns:46px 18px 1fr;align-items:start;padding-bottom:12px;font-size:.92rem;animation:rise .4s ease-out both}
.ev:nth-child(3){animation-delay:.06s}.ev:nth-child(4){animation-delay:.12s}.ev:nth-child(5){animation-delay:.18s}
.ev time{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ev .r{position:relative;align-self:stretch}
.ev .r::before{content:"";position:absolute;left:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.ev .r::after{content:"";position:absolute;left:9px;top:17px;bottom:-12px;width:1px;background:var(--line)}
.ev:last-child .r::after{display:none}
.ev b{font-weight:600}
.ev small{display:block;color:var(--muted);font-size:.78rem;margin-top:1px;overflow-wrap:anywhere}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;align-items:center;gap:16px}
.goal .ring{width:96px;height:96px;position:relative;flex:none}
.goal .ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.goal .ring circle{fill:none;stroke-width:10}
.goal .ring .bgc{stroke:var(--surface-2)}.goal .ring .fgc{stroke:var(--fg);stroke-linecap:round;animation:ringIn 1.1s ease-out both}
.goal .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem;font-variant-numeric:tabular-nums}
.team{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.team button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .84rem var(--f-body);cursor:pointer}
.team button[aria-current="true"]{border-color:var(--fg)}
.fab{position:fixed;right:max(16px,calc(50vw - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;min-height:56px;padding:0 20px;border-radius:18px;border:0;background:#1E2328;color:#D7F04A;font:700 1rem var(--f-body);display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;animation:rise .35s ease-out both}
:root[data-theme="dark"] .fab{background:#D7F04A;color:#121417}
.fab svg.i{width:20px;height:20px}
.fabpad{height:64px}
@keyframes nxIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(215,240,74,.5)}70%{box-shadow:0 0 0 14px rgba(215,240,74,0)}100%{box-shadow:0 0 0 0 rgba(215,240,74,0)}}
@keyframes blink{50%{opacity:.3}}
@keyframes pul{0%{box-shadow:0 0 0 0 rgba(62,142,47,.45)}70%{box-shadow:0 0 0 8px rgba(62,142,47,0)}100%{box-shadow:0 0 0 0 rgba(62,142,47,0)}}
@keyframes ringIn{from{stroke-dashoffset:289}}
@media (prefers-reduced-motion:reduce){.nx,.nx.new,.live,.calm,.ev,.fab,.goal .ring .fgc,.pulse,.nx .k i{animation:none}}
/* Catálogo */
.fprow{display:flex;align-items:center;gap:12px;padding:10px 0}.fprow+.fprow{border-top:1px solid var(--line)}
.fp{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:.66rem;font-weight:800;flex:none}
.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cat-it{display:flex;align-items:center;gap:12px;padding:12px 0}
.cat-it+.cat-it{border-top:1px solid var(--line)}
.cat-it.off{opacity:.55}
.cat-it .nm{font-weight:600}.cat-it .ds{font-size:.78rem;color:var(--muted)}
.cat-it .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{width:44px;height:28px;border-radius:14px;border:0;background:var(--surface-2);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="true"]{background:#1E2328}.sw[aria-checked="true"]::after{left:20px;background:#D7F04A}
:root[data-theme="dark"] .sw[aria-checked="true"]{background:#D7F04A}:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:#121417}

/* ===== Visual Material 3 (família Persuadir, igual ao Finanças) ===== */
:root{--bg:#F5F5F5;--surface:#FFFFFF;--surface-2:#ECECEE;--s3:#E3E3E6;--line:#DADCE0;--outline:#79747E;--fg:#1B1B1F;--muted:#636363;
  --accent:#1E2328;--accent-ink:#D7F04A;--accent-soft:#E9F3C2;--pc:#E9F3C2;--on-pc:#26300A;--seg-on:#E9F3C2;--shadow:none;
  --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--e3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3)}
:root[data-theme="dark"]{--bg:#121214;--surface:#1C1B1F;--surface-2:#25242A;--s3:#2E2D33;--line:#3A3940;--outline:#938F99;--fg:#E6E1E5;--muted:#AAA6AF;
  --accent:#D7F04A;--accent-ink:#1E2328;--accent-soft:#3A4314;--pc:#3A4314;--on-pc:#E9F3C2;--seg-on:#3A4314;--brand-c:#E3E5E8}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;width:24px;height:24px;overflow:hidden;flex:none;user-select:none;text-align:center}
.ms.i{font-size:20px;width:20px;height:20px}
.ms.i{font-size:20px;width:20px;height:20px}
.acct .av .cam .ms.i{font-size:14px;width:14px;height:14px}
.onb-card .ic .ms.i{font-size:40px;width:40px;height:40px}
.onb-card li .ms.i{font-size:18px;width:18px;height:18px}
.rolepick button span.ic2 .ms.i{font-size:30px;width:30px;height:30px}
.acct .role .ms.i{font-size:15px;width:15px;height:15px}
.brand .who .ms.i{font-size:16px;width:16px;height:16px}
.chip .ms.i{font-size:15px;width:15px;height:15px}
.picker button .ms.i{font-size:26px;width:26px;height:26px}
.shop .ic .ms.i{font-size:28px;width:28px;height:28px}
.tabs button .ms.i{font-size:23px;width:23px;height:23px}
.empty .ms.i{font-size:40px;width:40px;height:40px}
.mk-a .ms.i{font-size:16px;width:16px;height:16px}
.mapfs .ms.i{font-size:18px;width:18px;height:18px}
.mk-moto .ms.i{font-size:18px;width:18px;height:18px}
.calm .ms.ill{font-size:132px;width:132px;height:132px}
.fab .ms.i{font-size:20px;width:20px;height:20px}
.tipos .tic .ms.i{font-size:24px;width:24px;height:24px}
body{font-size:14px;line-height:20px;letter-spacing:.25px}
h1{font-size:24px;line-height:32px;font-weight:400;letter-spacing:0}
h2{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.eyebrow{font-weight:500;letter-spacing:.5px;text-transform:none;font-size:12px}
/* barra superior */
.top{position:sticky;top:0;z-index:12;background:var(--bg);min-height:64px;padding-block:0;margin-inline:-16px;padding-inline:16px 4px}
.top .iconbtn,.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:none;color:var(--muted)}
.iconbtn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.topacts{display:flex;align-items:center}
.bbadge{background:#B3261E!important;color:#fff!important}
/* cartões */
.card,.run,.routecard,.nightrow,.nitem,.calm,.live,.tl,.goal,.ped{border:0!important;border-radius:12px;box-shadow:none!important;background:var(--surface)}
.card{padding:16px}
.nitem{border-radius:12px;padding:12px 16px}.nitem.new{background:var(--pc);color:var(--on-pc)}
.nitem .ic{width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--fg)}
.nitem.new .ic{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.stat{border-radius:12px}.stat .v{font-weight:600}
.list{gap:0;background:var(--surface);border-radius:12px;padding:0 16px}
.list>.nightrow{border-radius:0!important;padding:12px 0;background:none}.list>.nightrow+.nightrow{border-top:1px solid var(--line)!important}
.run .n{border-radius:50%;background:var(--pc);color:var(--on-pc);font-weight:600}
.run .val b{font-weight:600}
/* botões */
.btn{min-height:40px;border-radius:20px;border:1px solid var(--outline);background:transparent;color:var(--fg);font-weight:500;font-size:14px;letter-spacing:.1px;padding:8px 24px;box-shadow:none}
.btn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{box-shadow:var(--e1);background:var(--accent)}
.btn.good{border-radius:20px}
.btn.sm{min-height:36px;border-radius:18px;padding:6px 16px;font-size:14px}
.btn.xl{min-height:56px;border-radius:28px;font-size:16px}
.btn.route{border-radius:20px}
.linkbtn{font-weight:500}
/* campos contornados */
label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.4px}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],input[type=tel],input[type=url],input[type=email],select,textarea{border:1px solid var(--outline)!important;border-radius:4px!important;background:transparent!important;min-height:56px;padding:14px 16px!important;font-size:16px;font-weight:400}
input:focus,select:focus,textarea:focus{border:2px solid var(--accent)!important;padding:13px 15px!important}
.lucrow input{min-height:44px;padding:8px 12px!important}
/* chips */
.chip{border-radius:8px;font-weight:500;letter-spacing:.1px}
.pill{border-radius:8px;min-height:32px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:13px;letter-spacing:.1px}
.pill.warn{background:var(--pc);border-color:transparent;color:var(--on-pc)}
.chips button{border-radius:8px;border-color:var(--outline)}
.chips button[aria-pressed="true"]{background:var(--pc);border-color:transparent;color:var(--on-pc)}
/* botões segmentados */
.seg{background:none;border:1px solid var(--outline);border-radius:20px;padding:0;gap:0;overflow:hidden}
.seg button{border-radius:0;height:40px;font-weight:500;color:var(--fg);box-shadow:none!important;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed="true"]{background:var(--pc)!important;color:var(--on-pc)}
.seg button[aria-pressed="true"]::before{content:"check";font-family:"Material Symbols Rounded";font-size:18px;line-height:1;font-feature-settings:"liga";-webkit-font-feature-settings:"liga"}
.seg button[aria-pressed="true"] .ms{display:none}
/* seletor de tipos e veículos */
.picker button,.tipos button{border-radius:12px}
.picker button[aria-pressed="true"]{background:var(--pc);color:var(--on-pc);border-color:transparent}
/* barra de navegação inferior */
.tabs{background:var(--surface-2);border-top:0;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.tabs button{font-size:12px;font-weight:500;letter-spacing:.5px;gap:4px;color:var(--muted)}
.tabs button .ms.i{font-size:24px;width:64px;height:32px;line-height:32px;padding:0;border-radius:16px;box-sizing:border-box}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"] .ms.i{background:var(--pc);color:var(--on-pc);font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
/* botão flutuante */
.fab{background:var(--pc)!important;color:var(--on-pc)!important;border-radius:16px;font-weight:500;font-size:14px;letter-spacing:.1px;box-shadow:var(--e3);bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.fab .ms.i{font-size:24px;width:24px;height:24px}
/* snackbar */
.toast{border-radius:4px!important;font-weight:400!important;text-align:left!important;min-height:48px;display:flex;align-items:center;padding:12px 16px!important;bottom:calc(96px + env(safe-area-inset-bottom,0px))!important;box-shadow:var(--e3)!important;background:#313033!important;color:#F4EFF4!important;font-size:14px}
/* Início: cartão de destaque com a frase e a ação */
.hero{background:#1E2328;color:#F2F4EF;border-radius:28px;padding:24px;gap:16px}
:root[data-theme="dark"] .hero{background:#23282D}
.hero .hi{color:#B9C0C6;font-size:14px;font-weight:500}
.hero .hi .iconbtn{color:#F2F4EF;width:40px;height:40px}
.hero .say{font-size:24px;line-height:32px;font-weight:500;letter-spacing:-.01em}
.hero .say em{background:none!important;box-shadow:none;color:#D7F04A;padding:0}
.hero .nx{background:transparent;border:0;padding:0;border-radius:0;animation:none}
.hero .nx+.nx{border-top:1px solid #2E353C;padding-top:16px}
.hero:has(.nx.new){animation:ring 1.8s ease-out .4s infinite}
.nx{border-radius:28px}
.nx .btn{border-radius:20px;min-height:40px}
.nx .btn.go{background:#D7F04A;color:#1E2328}
.nx .btn.ghost{background:rgba(242,244,239,.14);color:#F2F4EF}
.hero .lmap{border-radius:16px}
/* listas da linha do dia (Material) */
.tl{padding:8px 16px}
.tl h2{margin:8px 0 4px}
.ev2{min-height:56px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:8px 0;animation:rise .4s ease-out both}
.ev2+.ev2{border-top:1px solid var(--line)}
.ev2 .lead{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--on-pc)}
.ev2 .lead.ok{background:#D7F0DF;color:#1E7A45}.ev2 .lead.bad{background:#F9DEDC;color:#B3261E}.ev2 .lead.warn{background:#FBEBC2;color:#7A5A00}.ev2 .lead.mute{background:var(--surface-2);color:var(--muted)}
:root[data-theme="dark"] .ev2 .lead.ok{background:#11391F;color:#7DD6A0}:root[data-theme="dark"] .ev2 .lead.bad{background:#601410;color:#F2B8B5}:root[data-theme="dark"] .ev2 .lead.warn{background:#3D2F00;color:#F1C35A}
.ev2 b{display:block;font-size:16px;line-height:24px;font-weight:400;letter-spacing:.5px}
.ev2 small{display:block;color:var(--muted);font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ev2 time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
/* Ajustes em lista */
.lst{width:100%;min-height:56px;display:flex;align-items:center;gap:16px;border:0;background:none;padding:8px 0;text-align:left;color:var(--fg);font-size:16px;line-height:24px;letter-spacing:.5px;cursor:pointer;text-decoration:none}
.lst+.lst{border-top:1px solid var(--line)}
.lst>.ms{color:var(--muted)}
.lst .r{margin-left:auto;color:var(--muted);font-size:14px;letter-spacing:.25px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.lgroup{background:var(--surface);border-radius:12px;padding:0 16px}
.cfghead{display:flex;align-items:center;gap:8px;min-height:48px}
.cfghead h1{flex:1}
/* folhas que sobem de baixo */
.sheet:not([hidden]){top:max(40px,env(safe-area-inset-top,0px));bottom:0;left:0;right:0;inset:auto 0 0 0;height:calc(100dvh - 40px);border-radius:28px 28px 0 0;background:var(--surface);box-shadow:0 0 0 100vmax rgba(0,0,0,.32);padding-top:8px}
.sheet .bar{background:var(--surface)}
.sheet .bar h1{font-size:22px;line-height:28px;font-weight:400}
.sheet .wrap>.bar::before{content:"";position:absolute;top:-2px;left:50%;width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.4;transform:translateX(-50%)}
.sheet .card{background:var(--surface-2)}
.sheet input,.sheet select,.sheet textarea{background:var(--surface)!important}
@media (min-width:861px){.sheet:not([hidden]){inset:5vh 0 auto 0;margin:0 auto;width:min(680px,92vw);height:90vh;border-radius:28px}.sheet .wrap>.bar::before{display:none}}
/* notificações: painel sob o sino */
#notifSheet:not([hidden]){inset:auto;top:calc(64px + env(safe-area-inset-top,0px));right:16px;left:auto;width:min(400px,calc(100% - 32px));height:auto;max-height:70vh;border-radius:16px;background:var(--surface-2);box-shadow:var(--e3),0 0 0 100vmax rgba(0,0,0,.08);padding:8px 16px 12px;animation:fade .15s ease}
#notifSheet .bar{background:var(--surface-2);padding-block:4px}
#notifSheet .bar h1{font-size:16px;font-weight:500}
#notifSheet .wrap>.bar::before{display:none}
#notifSheet .list{background:none;padding:0}
#notifSheet .nitem{background:none;border-radius:0;padding:12px 0}#notifSheet .nitem+.nitem{border-top:1px solid var(--line)!important}
#notifSheet .nitem.new{background:none;color:var(--fg)}#notifSheet .nitem .ic{background:var(--pc);color:var(--on-pc)}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* computador: gaveta lateral como no Finanças */
@media (min-width:960px){
  body{padding-left:312px}
  .tabs{width:280px;padding:96px 12px 24px;background:var(--bg);border-right:0;gap:0}
  .tabs button{height:56px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 24px 0 16px;border-radius:28px;font-size:14px;font-weight:500;letter-spacing:.1px}
  .tabs button .ms.i{width:24px;height:24px;line-height:24px;background:none!important}
  .tabs button[aria-selected="true"]{background:var(--pc);color:var(--on-pc)}
  .top{position:fixed!important;top:0;left:0;width:280px;min-height:0;padding:28px 28px 0;background:transparent;margin:0;z-index:13}
  .topacts{position:fixed;top:12px;right:24px;z-index:13}
  body{padding-top:56px}
  #bellBtn{position:static!important}
  #tab-inicio>.calm:last-child,#tab-inicio>.calm:nth-last-child(2){grid-column:1/-1}
  .fab{bottom:24px!important;right:24px}
  .toast{bottom:24px!important}
}
@media (max-width:340px){.hero{padding:16px;border-radius:20px}.hero .say{font-size:18px;line-height:24px}}

  s+=`<circle class="m-a" cx="${A.x}" cy="${A.y}" r="7"/><text class="m-label" x="${A.x+12}" y="${A.y+16}">${esc(origemNome||"Partida")}</text>`;

/* ===== Receita ===== */
function chartSVG(mes,pts,o){
  // pts: [{id,d,a,b}] ordenados; o:{temB,rotA,rotB}
  const [y,m]=mes.split("-").map(Number); const total=new Date(y,m,0).getDate();
  const dias=mes===ym(new Date())?Math.min(total,Math.max(new Date().getDate(),7)):total;
  const W=340,H=196,pl=40,pr=12,pt=20,pb=24, iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max(10,...pts.map(p=>Math.max(p.a,o.temB?p.b:0)));
  const step=max<=40?10:max<=100?25:max<=200?50:max<=500?100:max<=1000?250:500, top=Math.ceil(max*1.1/step)*step;
  const X=d=>pl+(d-1)/(Math.max(dias-1,1))*iw, Y=v=>pt+ih-v/top*ih, f=n=>n.toFixed(1);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.rotA)}${o.temB?" × "+esc(o.rotB):""} em ${mes}">`;
  for(let v=0;v<=top;v+=step) s+=`<line class="c-grid" x1="${pl}" x2="${W-pr}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text class="c-axis" x="${pl-6}" y="${f(Y(v)+3)}" text-anchor="end">${v}</text>`;
  [...new Set([1,5,10,15,20,25,dias])].filter(d=>d<=dias&&(d===dias||dias-d>=3||d===1)).forEach(d=>s+=`<text class="c-axis" x="${f(X(d))}" y="${H-7}" text-anchor="middle">${d}</text>`);
  if(!pts.length) return s+`</svg>`;
  const path=k=>pts.map((p,i)=>`${i?"L":"M"}${f(X(p.d))},${f(Y(p[k]))}`).join("");
  if(o.temB){
    if(pts.length===1){ const p=pts[0]; s+=`<line class="c-meta" x1="${pl}" x2="${W-pr}" y1="${f(Y(p.b))}" y2="${f(Y(p.b))}"/>`; }
    else {
      for(let i=0;i<pts.length-1;i++){
        const p=pts[i], q=pts[i+1], d0=p.a-p.b, d1=q.a-q.b;
        const seg=(t0,t1,cls)=>{ const xa=t=>X(p.d+(q.d-p.d)*t), la=t=>p.a+(q.a-p.a)*t, lb=t=>p.b+(q.b-p.b)*t;
          s+=`<path class="c-fill ${cls}" d="M${f(xa(t0))},${f(Y(la(t0)))}L${f(xa(t1))},${f(Y(la(t1)))}L${f(xa(t1))},${f(Y(lb(t1)))}L${f(xa(t0))},${f(Y(lb(t0)))}Z"/>`; };
        if(d0*d1<0){ const t=d0/(d0-d1); seg(0,t,d0>0?"good":"bad"); seg(t,1,d1>0?"good":"bad"); }
        else seg(0,1,(d0+d1)>=0?"good":"bad");
      }
      s+=`<path class="c-meta ${o.bSolid?"solid":""}" d="${path("b")}"/>`;
    }
  } else if(pts.length>1) s+=`<path class="c-area" d="${path("a")}L${f(X(pts[pts.length-1].d))},${f(Y(0))}L${f(X(pts[0].d))},${f(Y(0))}Z"/>`;
  if(pts.length>1) s+=`<path class="c-line" d="${path("a")}"/>`;
  pts.forEach(p=>{ const cls=o.temB?(p.a>=p.b?"ok":"low"):"neu";
    s+=`<g class="c-col" tabindex="0" role="button" data-act="goto" data-n="${p.id}" aria-label="${esc(rotuloNoite(p.id))}: ${BRL(p.a)}"><title>${esc(rotuloNoite(p.id))} · ${esc(o.rotA)} ${BRL(p.a)}${o.temB?` · ${esc(o.rotB)} ${BRL(p.b)}`:""}</title>
      <rect class="c-hit" x="${f(X(p.d)-8)}" y="${pt}" width="16" height="${ih}"/><circle class="c-dot ${cls}" cx="${f(X(p.d))}" cy="${f(Y(p.a))}" r="4.5"/></g>`; });
  return s+`</svg>`;
}

  if(!S.vinc){ $("#recTitle").textContent=isEnt()?"Ganhos":"Extrato"; $("#receitaBody").innerHTML=`<div class="card flat empty">${svg("chart")}<span>${isEnt()?"Vincule-se a um negócio no Início.":"Nenhum entregador vinculado ainda."}</span></div>`; return; }

    ${(()=>{ if(!rows.length) return `<div class="empty">${svg("chart")}<span>Sem corridas neste mês.</span></div>`;
      const asc=[...rows].sort((a,b)=>a.id.localeCompare(b.id));
      if(isEnt()){
        const meta=metaSobra()>0, bat=meta?rows.filter(r=>r.t.valor>=metaNoite(r.t)).length:0;
        const pts=asc.map(r=>({id:r.id,d:+r.id.slice(8),a:r.t.valor,b:meta?metaNoite(r.t):0}));

        return (meta?`<div class="sectionhead"><span class="chip ${bat===rows.length?"good":bat?"acc":"bad"}">Meta batida em ${bat} de ${rows.length}</span><span class="small">Margem <b style="color:var(${marg>=0?"--good":"--bad"})">${marg>=0?"+":"−"}${BRL(Math.abs(marg))}</b></span></div>`:"")+chartSVG(mes,pts,{temB:meta,rotA:"Diária",rotB:"Meta"})+
          `<div class="legend"><span><i class="ln a"></i>Diária</span>${meta?`<span><i class="ln dash"></i>Meta</span><span><i class="bx good"></i>Acima</span><span><i class="bx bad"></i>Abaixo</span>`:""}</div>`;
      }
      const R=asc.map(r=>({r,x:resultadoNoite(r.id)})), comPed=R.filter(z=>z.x.inf>0);
      if(comPed.length){
        const pts=comPed.map(z=>({id:z.r.id,d:+z.r.id.slice(8),a:z.x.pedidos,b:z.x.custo}));
        return chartSVG(mes,pts,{temB:true,bSolid:true,rotA:"Pedidos",rotB:"Entregas"})+
          `<div class="legend"><span><i class="ln a"></i>Pedidos</span><span><i class="ln b"></i>Pago ao entregador</span><span><i class="bx good"></i>Lucro</span></div>`;
      }
      const pts=asc.map(r=>({id:r.id,d:+r.id.slice(8),a:r.t.valor,b:0}));
      return chartSVG(mes,pts,{temB:false,rotA:"Diária"})+`<div class="legend"><span><i class="ln a"></i>Diária</span></div>`; })()}
    ${isEnt()?`<div class="row" style="align-items:end;border-top:1px solid var(--line);padding-top:14px"><label>Meta: sobrar por noite (R$) <input type="text" inputmode="decimal" id="gMeta" value="${metaSobra()?n2(metaSobra()):""}" placeholder="Ex.: 40,00"></label><button class="btn primary" data-act="savemeta" style="flex:0 1 110px">Salvar</button></div>`:""}
  </div>
  <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div class="stat"><span class="eyebrow">${isEnt()?"Recebido":"Pago"}</span><span class="v">${BRL(pago)}</span></div>
    <div class="stat hl"><span class="eyebrow">${isEnt()?"A receber":"A pagar"}</span><span class="v">${BRL(Math.max(0,fat-pago))}</span></div>
    </div>
  <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div class="stat"><span class="eyebrow">Noites</span><span class="v">${rows.length}</span></div>
    <div class="stat"><span class="eyebrow">Corridas</span><span class="v">${n}</span></div>
    <div class="stat"><span class="eyebrow">Km</span><span class="v">${n1(km)}</span></div>
    ${isEnt()&&usaComb()?(()=>{const gas=S.abast.filter(a=>(a.data||"").startsWith(mes)).reduce((s,a)=>s+a.valor,0); const g=gas>0?gas:(km*2/(S.cfg.consumo||35))*precoLitro(); return `<div class="stat"><span class="eyebrow">Sobra</span><span class="v">${BRL(fat-g)}</span></div>`;})():""}</div>`;
  if(!isEnt()&&rows.length){ let L=0,P=0,inf=0,tot=0; rows.forEach(r=>{const x=resultadoNoite(r.id); L+=x.pedidos; P+=x.custo; inf+=x.inf; tot+=x.n;});

  h+=`<button class="btn" data-act="csv">Exportar planilha</button><div id="csvFallback"></div>`;
  $("#receitaBody").innerHTML=h;

/* ===== Extrato (proprietário) ===== */
function vendaDe(nid,c){ if(c.total) return {v:c.total,f:c.forma||"Outro",auto:true}; const L=lucrosDe(nid), v=L[c.id]; return {v:(v==null||v==="")?null:Number(v),f:L["f_"+c.id]||"Pix"}; }
const taxas=()=>({debito:1.5,credito:3.2,...((S.estab&&S.estab.taxas)||{})});
function taxaForma(f){ const t=taxas(); return f==="Débito"?t.debito:f==="Crédito"?t.credito:0; }
function idsPeriodo(p){
  const hoje=noiteId(), all=Object.keys(S.noites).filter(k=>(S.noites[k].corridas||[]).length);
  if(p==="hoje") return all.filter(k=>k===hoje);
  if(p==="semana"){ const d=idToDate(hoje); d.setDate(d.getDate()-6); const ini=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; return all.filter(k=>k>=ini&&k<=hoje); }
  return all.filter(k=>k.startsWith(ui.mes));
}
function extratoDe(ids){
  const r={vendas:0,nPed:0,semValor:0,repasse:0,maq:0,formas:{},jornadas:[]};
  ids.sort().reverse().forEach(id=>{ const doc=S.noites[id], t=totais(doc), pg=pagDe(id); r.repasse+=t.valor; r.jornadas.push({id,t,pg});
    (doc.corridas||[]).filter(c=>c.conta!==false&&["entregue","rota"].includes(c.status)).forEach(c=>{ const v=vendaDe(id,c);
      if(v.v==null){ r.semValor++; return; } r.nPed++; r.vendas+=v.v; const tx=v.v*taxaForma(v.f)/100; r.maq+=tx;
      const F=r.formas[v.f]=r.formas[v.f]||{n:0,v:0,tx:0}; F.n++; F.v+=v.v; F.tx+=tx; }); });
  r.saldo=r.vendas-r.repasse-r.maq; return r;
}
function renderExtrato(){
  const body=$("#receitaBody"); if(body.contains(document.activeElement)&&document.activeElement.tagName==="INPUT") return;
  const per=ui.ext||"hoje"; $("#hMes").hidden=per!=="mes"; $("#hMes").value=ui.mes;
  if(per==="mes") Store.garantirMes(ui.mes);
  const at=Store.ativos();
  const R=extratoDe(idsPeriodo(per)), rot={hoje:"Saldo de hoje",semana:"Saldo da semana",mes:"Saldo do mês"}[per];
  const tot=Math.max(R.vendas,1), w=x=>Math.max(0,x/tot*100).toFixed(1);
  let h=`<div class="seg" role="group" aria-label="Período" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[["hoje","Hoje"],["semana","Semana"],["mes","Mês"]].map(([k,l])=>`<button data-act="extp" data-p="${k}" aria-pressed="${per===k}">${l}</button>`).join("")}</div>`;
  if(at.length>1) h+=`<div class="team" role="group" aria-label="Equipe">${at.map(v=>`<button data-act="vsel" data-v="${v.id}" ${v.id===S.vid?'aria-current="true"':""}><span class="av2">${esc(iniciais(v.entNome))}</span>${esc((v.entNome||"Entregador").split(/\s+/)[0])}</button>`).join("")}</div>`;
  h+=`<section class="nx" style="gap:6px"><div class="s" style="font-weight:600;margin:0">${rot}</div><div class="num" style="font-size:2.1rem;font-weight:800;letter-spacing:-.02em">${BRL(R.saldo)}</div>
    <div class="s" style="margin:0">Vendas menos repasse e maquininha · sem o custo dos produtos</div>
    ${R.vendas?`<div role="img" aria-label="Composição das vendas" style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:10px;gap:2px"><div style="width:${w(R.saldo)}%;background:#D7F04A"></div><div style="width:${w(R.repasse)}%;background:#8A939A"></div><div style="width:${w(R.maq)}%;background:#F2777B"></div></div>`:""}</section>`;
  h+=`<div class="card"><div class="result">
    <div class="ln"><span>Vendas · ${pl(R.nPed,"pedido","pedidos")}</span><b class="num">${BRL(R.vendas)}</b></div>
    <div class="ln"><span><i class="sw2" style="background:#8A939A"></i>Repasse ao entregador</span><b class="num">− ${BRL(R.repasse)}</b></div>
    <div class="ln"><span><i class="sw2" style="background:#E5484D"></i>Maquininha</span><b class="num">− ${BRL(R.maq)}</b></div>
    <div class="ln tot"><span><i class="sw2" style="background:#B8D430"></i>Saldo</span><span class="num" style="color:var(${R.saldo>=0?"--good":"--bad"})">${BRL(R.saldo)}</span></div></div>
    ${R.semValor?`<button class="pill warn" data-act="tab" data-t="corridas" style="align-self:flex-start">${pl(R.semValor,"corrida sem valor do pedido","corridas sem valor do pedido")}</button>`:""}</div>`;
  const fs=FORMAS.filter(f=>R.formas[f]);
  if(fs.length) h+=`<div class="card" style="padding-block:6px">${fs.map(f=>{ const F=R.formas[f], tx=taxaForma(f);
    return `<div class="fprow"><span class="fp">${{Pix:"PIX",Dinheiro:"$",Débito:"DÉB",Crédito:"CRÉ",Outro:"•••"}[f]}</span><span style="flex:1"><b>${f} · ${F.n}</b><br><span class="muted small num">${tx?`${String(tx).replace(".",",")}% · ${BRL(F.tx)}`:"sem taxa"}</span></span><b class="num">${BRL(F.v)}</b></div>`; }).join("")}</div>`;
  const pend=R.jornadas.filter(j=>j.t.n&&!j.pg);
  if(pend.length) h+=`<div class="card"><div class="sectionhead"><h2>Repasse pendente</h2><b class="num">${BRL(pend.reduce((a,j)=>a+j.t.valor,0))}</b></div>
    ${pend.map(j=>`<button class="nightrow" data-act="goto" data-n="${j.id}"><span><b>${rotuloNoite(j.id)}</b><br><span class="muted small">${nCor(j.t.n)} · ${esc(iniciais(S.vinc&&S.vinc.entNome))}</span></span><span style="text-align:right"><b class="num">${BRL(j.t.valor)}</b><br><span class="chip warn">Registrar repasse</span></span></button>`).join("")}</div>`;
  const pagos=R.jornadas.filter(j=>j.pg);
  if(pagos.length) h+=`<div class="sectionhead"><h2>Repasses feitos</h2></div><div class="list">${pagos.map(j=>`<button class="nightrow" data-act="goto" data-n="${j.id}"><span><b>${rotuloNoite(j.id)}</b><br><span class="muted small">${nCor(j.t.n)} · ${esc(j.pg.forma||"")}</span></span><span style="text-align:right"><b class="num">${BRL(j.pg.valor)}</b><br><span class="chip good">Pago</span></span></button>`).join("")}</div>`;
  if(!R.jornadas.length) h+=`<div class="calm">${ILUSTRA}<b>Sem corridas neste período</b></div>`;
  const tx=taxas();
  h+=`<details class="card"><summary><b>Taxas da maquininha</b></summary><div class="row" style="margin-top:10px"><label>Débito (%) <input type="text" inputmode="decimal" id="txDeb" value="${String(tx.debito).replace(".",",")}"></label><label>Crédito (%) <input type="text" inputmode="decimal" id="txCre" value="${String(tx.credito).replace(".",",")}"></label></div></details>`;
  if(R.jornadas.length) h+=`<button class="btn" data-act="csv">Exportar planilha</button><div id="csvFallback"></div>`;
  body.innerHTML=h;
  ["txDeb","txCre"].forEach(k=>{ const el=$("#"+k); el.onchange=()=>{ const v=parseNum(el.value); if(!(v>=0&&v<30)) return toast("Taxa inválida");
    const t={...taxas(),[k==="txDeb"?"debito":"credito"]:Math.round(v*100)/100}; S.estab={...(S.estab||{}),taxas:t}; if(!ui.simProp) Store.queue("tx",()=>FB.update("estabs/"+S.uid,{taxas:t})); toast("Taxa salva"); el.blur(); renderExtrato(); }; });
}

function diffHTML(a,b){
  const fa=faixasOrd(a), fb=faixasOrd(b), keys=[...new Set([...fa.map(f=>f.ate),...fb.map(f=>f.ate)])].sort((x,y)=>x-y);
  const rows=keys.map(k=>{ const x=fa.find(f=>f.ate===k), y=fb.find(f=>f.ate===k);
    if(!x) return `<tr class="add"><td>até ${n1(k)} km</td><td>—</td><td>${BRL(y.valor)}${y.prov?" · prov.":""}</td></tr>`;
    if(!y) return `<tr class="del"><td>até ${n1(k)} km</td><td>${BRL(x.valor)}</td><td>removida</td></tr>`;
    const ch=x.valor!==y.valor||!!x.prov!==!!y.prov; if(!ch) return "";
    return `<tr><td>até ${n1(k)} km</td><td class="${ch?"old":""}">${BRL(x.valor)}${x.prov?" · prov.":""}</td><td class="${ch?"chg":""}">${BRL(y.valor)}${y.prov?" · prov.":""}</td></tr>`; }).join("");
  const ln=(l,x,y)=>x===y?"":`<tr><td>${l}</td><td class="old">${BRL(x)}</td><td class="chg">${BRL(y)}</td></tr>`;
  const iguais=keys.filter(k=>{const x=fa.find(f=>f.ate===k),y=fb.find(f=>f.ate===k); return x&&y&&x.valor===y.valor&&!!x.prov===!!y.prov;}).length;
  return `<div class="scroll"><table class="tbl diff"><thead><tr><th>Faixa</th><th>Em vigor</th><th>Proposta</th></tr></thead><tbody>${rows}${ln("Taxa mínima",a.taxaMin,b.taxaMin)}${ln("Por km acima",a.extraKm,b.extraKm)}</tbody></table></div>`;
}

/* ================= Lixeira, limpeza e exclusão ================= */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lixeira=()=>ui.simProp?(ui.sim.lixeira||[]):S.lixeira;
function lotesLixeira(){ const m={}; lixeira().forEach(e=>{ (m[e.lote]=m[e.lote]||{lote:e.lote,rotulo:e.rotulo,em:e.em,itens:[]}).itens.push(e); }); return Object.values(m).sort((a,b)=>b.em-a.em); }
function lxAdd(entries){
  const out=entries.map(e=>({id:"lx_"+newId(),...e}));
  if(ui.simProp){ ui.sim.lixeira.push(...out); return; }
  out.forEach(({id,...e})=>{ S.lixeira.push({id,...e}); Store.setPriv(id,e); });
}
function lxDel(id){ if(ui.simProp){ ui.sim.lixeira=ui.sim.lixeira.filter(x=>x.id!==id); return; } S.lixeira=S.lixeira.filter(x=>x.id!==id); Store.delPriv(id); }
function corridaParaLixeira(nid,cid){
  const doc=clone(S.leg[nid]); const i=doc.corridas.findIndex(c=>c.id===cid); if(i<0) return; const c=doc.corridas[i]; doc.corridas.splice(i,1); doc.atualizado=new Date().toISOString();
  lxAdd([{tipo:"corrida",vid:S.vid,lote:newId(),rotulo:`Corrida ${pad(i+1)} · ${rotuloNoite(nid)} · ${addrLine(c.end)} · ${BRL(c.valor)}`,noite:nid,item:c,em:Date.now()}]);
  if(doc.corridas.length) Store.saveNoite(nid,doc); else Store.delNoite(nid);
}
function abastParaLixeira(id){
  const a=S.abast.find(x=>x.id===id); if(!a) return;
  lxAdd([{tipo:"abast",lote:newId(),rotulo:`Abastecimento · ${a.data.split("-").reverse().join("/")} · ${BRL(a.valor)}`,item:a,em:Date.now()}]);
  Store.delAbast(id);
}
function inserirCorridas(nid,lista){
  const doc=clone(S.leg[nid]||{data:nid,corridas:[]}); doc.corridas=doc.corridas||[];
  lista.forEach(c=>{ if(!doc.corridas.some(x=>x.id===c.id)) doc.corridas.push(c); });
  doc.corridas.sort((a,b)=>(a.ts||0)-(b.ts||0)); doc.atualizado=new Date().toISOString(); Store.saveNoite(nid,doc);
}
function restaurarLote(lote){
  const itens=lixeira().filter(e=>e.lote===lote); let bloq=0, outro=0;
  itens.forEach(e=>{
    if(e.tipo==="corrida"||e.tipo==="noite"){ if(e.vid&&e.vid!==S.vid){ outro++; return; } if(pagDe(e.noite)){ bloq++; return; } inserirCorridas(e.noite,e.tipo==="corrida"?[e.item]:e.itens); }
    else if(e.tipo==="abast") Store.saveAbast(e.item);
    else if(e.tipo==="abasts") e.itens.forEach(a=>Store.saveAbast(a));
    else if(e.tipo==="pedidos"){ const v={...e.valores,...(S.lucros[e.noite]||{})}; S.lucros[e.noite]=v; Store.setPriv("lu_"+e.noite,{valores:v}); }
    lxDel(e.id);
  });
  ui.ds=null; render();
  toast(outro?"Abra o estabelecimento de origem para restaurar esses itens.":bloq?`Restaurado. ${bloq} item(ns) de noite já paga ficaram na Lixeira.`:"Restaurado");
}
function apagarLote(lote){ lixeira().filter(e=>e.lote===lote).forEach(e=>lxDel(e.id)); }
function limparDados(){
  const lote=newId(), em=Date.now(), ent=[];
  if(isEnt()){
    let nc=0;
    Object.keys(S.leg).forEach(nid=>{ const cs=S.leg[nid].corridas||[]; if(!cs.length||pagDe(nid)) return; nc+=cs.length;
      ent.push({tipo:"noite",vid:S.vid,lote,noite:nid,itens:cs,em}); });
    const ab=[...S.abast]; for(let i=0;i<ab.length;i+=150) ent.push({tipo:"abasts",lote,itens:ab.slice(i,i+150),em});
    const rot=`Limpeza de dados · ${nc} corridas, ${ab.length} abastecimentos`; ent.forEach(e=>e.rotulo=rot);
    if(!ent.length) return toast("Não há dados para limpar (noites pagas ficam protegidas).");
    lxAdd(ent);
    ent.filter(e=>e.tipo==="noite").forEach(e=>Store.delNoite(e.noite));
    ab.forEach(a=>Store.delAbast(a.id));
  } else {
    const L=ui.simProp?ui.sim.lucros:S.lucros; const ids=Object.keys(L).filter(k=>Object.keys(L[k]||{}).length);
    if(!ids.length) return toast("Não há valores de pedido para limpar.");
    const n=ids.reduce((a,k)=>a+Object.keys(L[k]).length,0);
    lxAdd(ids.map(k=>({tipo:"pedidos",lote,noite:k,valores:L[k],rotulo:`Limpeza de dados · ${n} valores de pedido`,em})));
    ids.forEach(k=>{ if(ui.simProp) delete ui.sim.lucros[k]; else { delete S.lucros[k]; Store.delPriv("lu_"+k); } });
  }
  toast(ui.simProp?"Simulação: dados enviados para a Lixeira (não salvo)":"Dados enviados para a Lixeira");
}
async function excluirPerfil(){
  toast("Excluindo…");
  try{
    const uid=S.uid, ps=[];
    const priv=await new Promise(ok=>{ let u=null; u=FB.onCol(`users/${uid}/priv`,l=>{ ok(l.map(x=>x.id)); setTimeout(()=>u&&u(),0); },()=>ok([])); });
    priv.forEach(id=>ps.push(FB.del(`users/${uid}/priv/${id}`).catch(()=>{})));
    S.vincs.forEach(v=>{
      if(v.status==="ativo") ps.push(FB.update("vinculos/"+v.id,{status:"encerrado",encerradoEm:Date.now(),encerradoPor:S.role}).catch(()=>{}));
      else if(isEnt()&&(v.status==="pendente"||v.status==="recusado")) ps.push(FB.del("vinculos/"+v.id).catch(()=>{}));
    });
    if(!isEnt()&&S.estab){ if(S.estab.codigo) ps.push(FB.del("codigos/"+S.estab.codigo).catch(()=>{})); ps.push(FB.update("estabs/"+uid,{codigo:"",excluido:true,donoCel:"",whats:""}).catch(()=>{})); }
    await Promise.all(ps);
    await FB.del("users/"+uid).catch(()=>{});
    Store.limpar();
    await FB.deleteMe();
    ui.onbAba="criar"; ui.onbRole=null; ui.unlocked=false; ui.draft=null;
    toast("Perfil excluído. O histórico das entregas foi mantido.");
  }catch(e){ console.error(e); toast(fbMsg(e)); }
}

async function dsConfirmar(){
  const d=ui.ds; if(!d) return;
  if(!(await senhaOk($("#dsPin").value))) return toast("Senha incorreta");

async function pedirVinculo(){

  if(ex&&ex.status==="ativo") return toast("Você já está vinculado a este negócio");
  if(ex&&ex.status==="pendente") return toast("Pedido já enviado. Aguarde o aceite.");
  const cad=meuCad(), now=Date.now();
  const doc={eid:c.eid,donoUid:c.donoUid,entUid:S.uid,codigo:code,status:"pendente",estabNome:c.nome||"",entNome:cad.nome||(S.me&&S.me.nome)||"",entUsuario:cad.usuario||(S.me&&S.me.usuario)||"",entCel:cad.cel||"",entVeiculo:S.cfg.veiculo||"moto",criado:now};

function lerTbDraft(errs){
  const d=ui.tbDraft||tbBase();
  const fs=d.faixas.map(f=>({ate:Math.round(f.ate*10)/10,valor:Math.round(f.valor*100)/100,...(f.prov?{prov:true}:{})}));
  if(!fs.length) errs.push("A tabela precisa ter pelo menos uma faixa.");
  fs.forEach((f,i)=>{ if(!(f.ate>0)||!(f.valor>=0)) errs.push(`Faixa ${i+1}: km ou valor inválido.`); if(i&&f.ate<=fs[i-1].ate) errs.push(`Faixa ${i+1}: o km precisa ser maior que o da faixa de cima.`); });
  const mn=ui.tbEdit?parseNum($("#tbMin").value):d.taxaMin, ex=ui.tbEdit?parseNum($("#tbExtra").value):d.extraKm;
  if(!(mn>=0)) errs.push("Taxa mínima inválida."); if(!(ex>=0)) errs.push("Valor por km acima inválido.");
  return {faixas:fs,taxaMin:Math.round(mn*100)/100,extraKm:Math.round(ex*100)/100};
}

async function hashPin(p){ const data=new TextEncoder().encode("diaria-entregas:"+p);
  try{const h=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=0;for(const b of data)h=(h*31+b)>>>0;return "x"+h.toString(16);} }

const MAPAS_GL=new Set();
function novoMapaGL(el,{interativo=true}={}){
  const gl=window.maplibregl, escuro=temaEscuro();
  const cm=centroMapa(); lembrarPos();
  const m=new gl.Map({container:el,style:escuro?ESTILO.escuro:ESTILO.claro,center:[cm.p.lng,cm.p.lat],zoom:cm.z,attributionControl:{compact:true},interactive:interativo,pitchWithRotate:false,fadeDuration:120});
  if(interativo) m.addControl(new gl.NavigationControl({showCompass:true,visualizePitch:false}),"top-right");
  let pronto=false, fila=[];
  const quando=f=>{ if(pronto) f(); else fila.push(f); };
  const C={m,mk:{},pts:null,_anim:0,escuro,
    camadas(){
      const cor=this.escuro?{casca:"#1E2328",linha:"#D7F04A"}:{casca:"#D7F04A",linha:"#1E2328"};
      if(!m.getSource("rota")) m.addSource("rota",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
      if(!m.getLayer("rota-casca")) m.addLayer({id:"rota-casca",type:"line",source:"rota",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":cor.casca,"line-width":["interpolate",["linear"],["zoom"],11,6,16,13],"line-opacity":.95}});
      if(!m.getLayer("rota-linha")) m.addLayer({id:"rota-linha",type:"line",source:"rota",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":cor.linha,"line-width":["interpolate",["linear"],["zoom"],11,3,16,6]}});
      this.dados(this.pts);
    },
    dados(pts){ const s=m.getSource("rota"); if(s) s.setData({type:"FeatureCollection",features:pts&&pts.length>1?[{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:pts.map(([la,ln])=>[ln,la])}}]:[]}); },
    pin(k,p,arrastar,cb){
      if(!ptOk(p)){ if(this.mk[k]){ this.mk[k].remove(); delete this.mk[k]; } return; }
      const ll=[p.lng,p.lat];
      if(this.mk[k]){ if(k==="moto") this.deslizar(this.mk[k],ll); else this.mk[k].setLngLat(ll); return; }
      const d=MK[k](), e=document.createElement("div"); e.className="mk-"+k; e.innerHTML=d.html;
      const mk=new gl.Marker({element:e,anchor:k==="b"?"bottom":"center",draggable:!!arrastar}).setLngLat(ll).addTo(m);
      if(arrastar&&cb) mk.on("dragend",()=>{ const q=mk.getLngLat(); cb({lat:r6(q.lat),lng:r6(q.lng)}); });
      this.mk[k]=mk;
    },
    deslizar(mk,para){ const de=mk.getLngLat(), t0=performance.now(), T=900;
      const passo=t=>{ const k=Math.min(1,(t-t0)/T), e=1-Math.pow(1-k,3); mk.setLngLat([de.lng+(para[0]-de.lng)*e,de.lat+(para[1]-de.lat)*e]); if(k<1) requestAnimationFrame(passo); }; requestAnimationFrame(passo); },
    rota(pts,animar){
      const novo=JSON.stringify(pts||null)!==JSON.stringify(this.pts); this.pts=pts&&pts.length>1?pts:null;
      quando(()=>{ cancelAnimationFrame(this._anim);
        if(!this.pts||!animar||!novo){ this.dados(this.pts); return; }
        const P=this.pts, t0=performance.now(), T=Math.min(1100,350+P.length*12);
        const passo=t=>{ const k=Math.min(1,(t-t0)/T), n=Math.max(2,Math.ceil(P.length*(1-Math.pow(1-k,2)))); this.dados(P.slice(0,n)); if(k<1) this._anim=requestAnimationFrame(passo); };
        this._anim=requestAnimationFrame(passo); });
    },
    ajustar(){
      const ls=[]; Object.values(this.mk).forEach(x=>{ const q=x.getLngLat(); ls.push([q.lng,q.lat]); }); if(this.pts) this.pts.forEach(([la,ln])=>ls.push([ln,la]));
      if(ls.length>1){ const b=new gl.LngLatBounds(ls[0],ls[0]); ls.forEach(x=>b.extend(x)); m.fitBounds(b,{padding:{top:44,bottom:44,left:36,right:36},maxZoom:16,duration:pronto?600:0}); }
      else if(ls.length===1) m.jumpTo({center:ls[0],zoom:15.5});
    },
    onClick(f){ m.on("click",e=>f({lat:r6(e.lngLat.lat),lng:r6(e.lngLat.lng)})); },
    resize(){ m.resize(); },
    tema(){ const esc=temaEscuro(); if(esc===this.escuro) return; this.escuro=esc; m.setStyle(esc?ESTILO.escuro:ESTILO.claro); },
    remove(){ MAPAS_GL.delete(this); try{ m.remove(); }catch(e){} }
  };
  m.on("style.load",()=>{ C.camadas(); if(!pronto){ pronto=true; fila.splice(0).forEach(f=>f()); } });
  m.on("error",e=>{ if(C.escuro&&!C._fb&&!pronto){ C._fb=1; m.setStyle(ESTILO.claro); } });
  botaoTelaCheia(el,C); MAPAS_GL.add(C);
  return C;
}

/* Endereço → ponto (Nominatim/OpenStreetMap: 1 consulta por segundo, só quando o usuário pede) */
let geoUlt=0;
async function geoBusca(q){
  const espera=geoUlt+1100-Date.now(); if(espera>0) await new Promise(r=>setTimeout(r,espera)); geoUlt=Date.now();

  if(ptOk(o)){ const d=.35; par.viewbox=[o.lng-d,o.lat+d,o.lng+d,o.lat-d].map(v=>v.toFixed(4)).join(","); }
  u.search=new URLSearchParams(par).toString();
  const r=await fetch(u.toString(),{headers:{Accept:"application/json"}}); if(!r.ok) throw new Error("geo "+r.status);
  return (await r.json()).map(x=>({lat:r6(+x.lat),lng:r6(+x.lon),nome:x.display_name||""}));

async function geocodificar(e){
  e=e||{}; const rua=(e.rua||"").trim(), num=(e.numero||"").trim(), bairro=(e.bairro||"").trim();
  const tentativas=[];
  const cid=cidadeLoja(), c=cid?", "+cid:"";
  if(rua&&num) tentativas.push(`${rua}, ${num}${bairro?", "+bairro:""}${c}`);
  if(rua) tentativas.push(`${rua}${bairro?", "+bairro:""}${c}`);
  if(rua&&bairro) tentativas.push(`${rua}${c}`);
  if(bairro) tentativas.push(`${bairro}${c}`);
  for(const q of tentativas){ const l=await geoBusca(q); if(l.length) return {...l[0],exato:q===tentativas[0]&&!!num}; }
  return null;
}
function minhaPosicao(){
  return new Promise((ok,err)=>{ if(!navigator.geolocation) return err(new Error("sem gps"));
    navigator.geolocation.getCurrentPosition(p=>ok({lat:r6(p.coords.latitude),lng:r6(p.coords.longitude)}),err,{enableHighAccuracy:true,timeout:15000,maximumAge:20000}); });

/* Rota entre dois pontos: OpenRouteService (com chave) ou OSRM público */
const rotaCache={};
async function rotear(a,b){
  const key=[a.lat,a.lng,b.lat,b.lng].join(","); if(rotaCache[key]) return rotaCache[key];
  let dist,dur,coords;
  if(ORS_KEY){
    const r=await fetch(`https://api.openrouteservice.org/v2/directions/driving-car?api_key=${encodeURIComponent(ORS_KEY)}&start=${a.lng},${a.lat}&end=${b.lng},${b.lat}`);
    if(!r.ok) throw new Error("rota "+r.status); const j=await r.json(), ft=j.features&&j.features[0]; if(!ft) throw new Error("rota");
    dist=ft.properties.summary.distance; dur=ft.properties.summary.duration; coords=ft.geometry.coordinates;
  } else {
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
    if(!r.ok) throw new Error("rota "+r.status); const j=await r.json(), rt=j.routes&&j.routes[0]; if(!rt) throw new Error("rota");
    dist=rt.distance; dur=rt.duration; coords=rt.geometry.coordinates;
  }
  const res={km:Math.round(dist/100)/10,min:Math.max(1,Math.round(dur/60)),pts:coords.map(([x,y])=>[r6(y),r6(x)])};
  rotaCache[key]=res; return res;
}
/* Rota guardada de forma compacta (polyline do Google, precisão 5) */
function simplificar(pts,max=90){ if(pts.length<=max) return pts; const passo=(pts.length-1)/(max-1), o=[]; for(let i=0;i<max;i++) o.push(pts[Math.round(i*passo)]); return o; }
function polyEnc(pts){ let s="",pl=0,pg=0; const enc=v=>{ v=v<0?~(v<<1):v<<1; let o=""; while(v>=0x20){ o+=String.fromCharCode((0x20|(v&0x1f))+63); v>>=5; } return o+String.fromCharCode(v+63); };
  pts.forEach(([la,ln])=>{ const a=Math.round(la*1e5), b=Math.round(ln*1e5); s+=enc(a-pl)+enc(b-pg); pl=a; pg=b; }); return s; }
function polyDec(s){ const o=[]; let i=0,la=0,ln=0; const dec=()=>{ let r=0,sh=0,b; do{ b=s.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20); return r&1?~(r>>1):r>>1; };
  try{ while(i<s.length){ la+=dec(); ln+=dec(); o.push([la/1e5,ln/1e5]); } }catch(e){} return o; }
